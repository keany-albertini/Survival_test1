<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Survival — Choisir un spawn</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 15%,#233d48,#061016 62%,#020608);color:#fff;font-family:Arial,sans-serif}body{padding:18px}.wrap{width:min(920px,100%);margin:auto}.title{text-align:center;margin:12px 0 4px;font-family:Georgia,serif;color:#f1d28a;letter-spacing:2px}.sub{text-align:center;color:#aebbc0;font-size:12px;margin:0 0 18px}.tier{margin:18px 0 7px;font-size:11px;font-weight:900;letter-spacing:1.6px}.tier.easy{color:#83d16f}.tier.medium{color:#e2ba60}.tier.hard{color:#ee756a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.point{border:1px solid #ffffff20;background:linear-gradient(145deg,#17262e,#0b151b);border-radius:14px;padding:13px;color:#fff;text-align:left;min-height:126px;box-shadow:0 8px 25px #0006}.point:active{transform:scale(.985)}.ico{font-size:26px}.point strong{display:block;color:#f1d48d;margin:6px 0 4px;font-size:13px}.point small{display:block;color:#9eacb0;font-size:10px;line-height:1.4}.go{display:block;margin-top:9px;font-size:9px;font-weight:900;color:#e8eee8}.status{text-align:center;min-height:22px;margin-top:14px;color:#f0d28e;font-weight:700}.back{display:block;width:max-content;margin:18px auto;color:#b7c2c6;text-decoration:none;font-size:11px}@media(max-width:640px){.grid{grid-template-columns:1fr}.point{min-height:92px;display:grid;grid-template-columns:44px 1fr;column-gap:8px}.ico{grid-row:1/4}.point strong{margin:0 0 3px}}</style></head><body><main class="wrap"><h1 class="title">CHOISIS TON POINT DE DÉPART</h1><p class="sub">Ton choix détermine la difficulté de tes premières minutes de survie.</p><div id="choices"></div><div id="status" class="status">Chargement du survivant...</div><a class="back" href="characters.html">← Retour aux personnages</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="spawn-page.js?v=2"></script></body></html>
