<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Serveurs</title><style>*{box-sizing:border-box}body{margin:0;background:#06131b;color:#f5dfad;font-family:Georgia,serif}.page{min-height:100dvh;padding:16px 14px 90px;background:linear-gradient(#03101a66,#02080de8),url('tavern-bg.png') center/cover fixed}.shell{max-width:600px;margin:auto}.back{color:#efc46d;text-decoration:none}.logo{display:block;width:min(60vw,280px);max-height:125px;object-fit:contain;margin:4px auto}.title{text-align:center;margin:4px 0;color:#f2cc78}.sub{text-align:center;color:#c9bea4;font-size:12px;margin-bottom:18px}.servers{display:grid;gap:10px}.server{width:100%;min-height:82px;padding:12px 14px;text-align:left;border:1px solid #80683f;background:#071411e8;color:#f5dfad;display:grid;grid-template-columns:1fr auto;align-items:center}.server:active{transform:scale(.99)}.name{font:bold 16px Georgia;color:#f1ce83}.meta{font-size:10px;color:#ad9f80;margin-top:6px}.status{font-size:10px;color:#9fd59f;border:1px solid #496b4d;padding:6px 8px}.hint{text-align:center;font-size:10px;color:#9f947c;margin-top:18px}.studio{position:fixed;right:9px;bottom:7px;width:92px;height:63px}.studio img{width:100%;height:100%;object-fit:contain}</style></head><body><main class="page"><div class="shell"><a class="back" href="index.html">← ACCUEIL</a><img class="logo" src="Logo-titre.png"><h1 class="title">CHOISIS TON SERVEUR</h1><p class="sub">Chaque serveur possède ses propres personnages et sa propre progression.</p><section id="servers" class="servers"></section><p id="message" class="hint">Chargement des serveurs...</p></div><footer class="studio"><img src="nini-pepita-logo.png?v=2"></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await sb.from('game_servers').select('*').order('name');if(error){message.textContent='Impossible de charger les serveurs.';return}servers.innerHTML='';(data||[]).forEach(s=>{const b=document.createElement('button');b.className='server';b.innerHTML='<div><div class="name">'+s.name+'</div><div class="meta">'+s.region+' • '+s.max_players+' places</div></div><span class="status">'+(s.status==='online'?'EN LIGNE':s.status.toUpperCase())+'</span>';b.disabled=s.status!=='online';b.onclick=()=>{sessionStorage.setItem('survival_server_id',s.id);sessionStorage.setItem('survival_server_name',s.name);sessionStorage.removeItem('survival_character_id');location.href='characters.html'};servers.appendChild(b)});message.textContent=data&&data.length?'Sélectionne un serveur pour continuer.':'Aucun serveur disponible.'}init();</script></body></html>
