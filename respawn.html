<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Réapparition</title><style>html,body{margin:0;height:100%;background:#050b0f;color:#f1d28e;font-family:Arial,sans-serif;display:grid;place-items:center}.c{text-align:center;padding:24px}.c h1{font-family:Georgia,serif;letter-spacing:2px}.c p{color:#aebbc0}</style></head><body><div class="c"><h1>RÉAPPARITION</h1><p id="m">Recherche de ton point de spawn...</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const id=sessionStorage.getItem('survival_character_id');if(!id||!window.sb){location.replace('characters.html');return}let r=null;try{r=JSON.parse(localStorage.getItem('survival_respawn_'+id)||'null')}catch{}if(!r||!Number.isFinite(Number(r.x))||!Number.isFinite(Number(r.z))){document.getElementById('m').textContent='Aucun lit ni sac de couchage actif. Choisis un nouveau point de départ.';setTimeout(()=>location.replace('spawn.html?respawn=1'),900);return}document.getElementById('m').textContent='Retour vers '+(r.type==='sleeping_bag'?'ton sac de couchage':'ton lit')+'...';const {error}=await sb.from('characters').update({position_x:Number(r.x),position_y:Number(r.z),has_spawned:true,life:100,hunger:70,thirst:70,energy:100}).eq('id',id);if(error){document.getElementById('m').textContent='Erreur de réapparition.';return}setTimeout(()=>location.replace('world.html?v=4'),350)})();</script></body></html>
