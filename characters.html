<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Sélection des personnages</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#080402;color:#f5e1ae}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));overflow:hidden}.page:before{content:"";position:absolute;inset:0;background:linear-gradient(#05030155,#07100db8 58%,#020302e8),radial-gradient(circle at 50% 24%,transparent 5%,#0009 100%)}.shell{position:relative;z-index:1;width:min(94vw,520px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.back,.logout{border:0;background:none;color:#d7b16b;font-family:inherit;text-decoration:none;font-size:11px;letter-spacing:1px;padding:7px;cursor:pointer}.logo{display:block;width:min(76vw,350px);max-height:21vh;object-fit:contain;margin:-4px auto 2px;filter:drop-shadow(0 9px 12px #000d)}h1{text-align:center;margin:4px 0 2px;font-size:clamp(21px,6vw,29px);color:#f4d48c;text-shadow:0 3px 5px #000;letter-spacing:.6px}.muted{text-align:center;margin:0 0 14px;color:#c8b892;font-size:11px}.slots{display:grid;gap:10px}.character-card,.empty-slot{position:relative;min-height:94px;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;padding:10px 11px;background:linear-gradient(165deg,#45473fef,#20231ff2 52%,#121713f5);border:1px solid #806d47;box-shadow:0 8px 15px #000b,inset 0 1px #ffffff24,inset 0 -4px #0007;clip-path:polygon(3% 5%,20% 1%,39% 4%,57% 1%,76% 4%,96% 2%,100% 15%,98% 42%,100% 72%,96% 96%,73% 98%,53% 95%,31% 99%,4% 95%,0 75%,2% 48%,0 20%)}.avatar{width:65px;height:70px;display:grid;place-items:center;font-size:31px;border-radius:50% 47% 48% 44%;background:radial-gradient(circle at 45% 35%,#62675b,#272d27 58%,#111);border:2px solid #8f784b;box-shadow:inset 0 0 12px #000,0 3px 8px #0009}.char-info h3{margin:0 0 5px;color:#f4d794;font-size:18px}.char-info p{margin:0;color:#bcb092;font-size:11px}.play,.create-btn,.submit{font-family:inherit;text-transform:uppercase;font-weight:800;color:#e8c987;border:1px solid #8f7546;background:linear-gradient(#45473f,#20231f);box-shadow:inset 0 1px #ffffff20,inset 0 -3px #0009,0 3px 7px #0008;min-height:39px;padding:0 13px;cursor:pointer;clip-path:polygon(6% 4%,94% 0,100% 18%,97% 83%,90% 100%,7% 96%,0 78%,3% 17%)}.empty-slot{grid-template-columns:72px 1fr;opacity:.9;cursor:pointer}.empty-icon{width:65px;height:65px;display:grid;place-items:center;border:2px dashed #8a774f;border-radius:50%;font-size:30px;color:#d1b16e}.empty-slot strong{display:block;color:#dfc27e;font-size:15px}.empty-slot span{font-size:10px;color:#aaa087}.creator{display:none;margin-top:13px;padding:15px;background:linear-gradient(170deg,#33372ff5,#151a16f8);border:1px solid #8d7648;box-shadow:0 10px 20px #000c,inset 0 0 0 2px #171b17}.creator h2{text-align:center;margin:0 0 12px;color:#efd18a;font-size:20px}.races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.race{min-height:58px;border:1px solid #716344;background:#20251f;color:#cdbb91;font-family:inherit;font-size:10px;padding:5px 2px;cursor:pointer}.race b{display:block;font-size:21px;margin-bottom:2px}.race.active{border-color:#d0a65c;color:#ffe0a0;background:#3c4036;box-shadow:inset 0 0 0 1px #7d693f}.field{margin:9px 0}.field label{display:block;font-size:9px;letter-spacing:1.1px;color:#c9aa69;margin-bottom:4px}.field input,.field select{width:100%;height:41px;border:1px solid #6f6245;background:#101712e8;color:#f5e3b7;padding:0 10px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.submit{width:100%;margin-top:8px;min-height:45px}.message{text-align:center;font-size:11px;margin-top:7px}.studio{display:flex;justify-content:center;height:70px;margin-top:9px}.studio img{max-height:100%;max-width:120px;object-fit:contain;filter:drop-shadow(0 4px 7px #000)}@media(max-height:700px){.logo{max-height:16vh}.character-card,.empty-slot{min-height:80px}.studio{height:52px}}</style></head><body><main class="page"><div class="shell"><div class="top"><a class="back" href="index.html">← ACCUEIL</a><button id="logout" class="logout">DÉCONNEXION</button></div><img class="logo" src="Logo-titre.png" alt="Survival"><h1>Sélection des personnages</h1><p id="welcome" class="muted">Chargement de tes personnages...</p><div id="characterList" class="slots"></div><section id="creator" class="creator"><h2>Créer un personnage</h2><div class="races"><button class="race active" data-race="Humain"><b>♙</b>HUMAIN</button><button class="race" data-race="Ogre"><b>♜</b>OGRE</button><button class="race" data-race="Gnome"><b>♟</b>GNOME</button><button class="race" data-race="Elfe"><b>♞</b>ELFE</button></div><div class="field"><label>NOM DU PERSONNAGE</label><input id="characterName" maxlength="18" minlength="2" placeholder="Ex. Kael"></div><div class="row"><div class="field"><label>SEXE</label><select id="characterSex"><option>Homme</option><option>Femme</option></select></div><div class="field"><label>STYLE</label><select id="characterStyle"><option>Explorateur</option><option>Chasseur</option><option>Bâtisseur</option><option>Guerrier</option></select></div></div><button id="saveCharacter" class="submit">CRÉER CE PERSONNAGE</button><div id="characterMessage" class="message"></div></section><footer class="studio"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="characters.js"></script></body></html>
