<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Sélection des personnages</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:#05090c;color:#f5e2b0}.page{position:relative;min-height:100dvh;background:linear-gradient(#07101b55,#020609d9),url('tavern-bg.png') center/cover fixed no-repeat;padding:12px 12px 90px}.shell{width:min(95vw,540px);margin:auto}.top{display:flex;justify-content:space-between}.back,.logout{border:0;background:#09131bd0;color:#d9b96f;padding:8px 10px;font:11px Georgia;text-decoration:none}.logo{display:block;width:min(72vw,330px);max-height:19vh;object-fit:contain;margin:-4px auto 0}h1{text-align:center;color:#f3d38a;margin:2px 0}.welcome{text-align:center;color:#bfb291;font-size:11px}.slots{display:grid;gap:11px;touch-action:pan-y}.character-card{min-height:230px;display:grid;grid-template-columns:44% 1fr;grid-template-rows:1fr auto;align-items:center;gap:10px;padding:11px;background:linear-gradient(145deg,#202824f2,#0c1514f5);border:1px solid #967947;box-shadow:0 14px 30px #0009;overflow:hidden}.avatar{height:180px;background:#1b211e;border:1px solid #8c7549;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.char-info h3{color:#f1d18a;margin:0;font-size:24px}.char-info p{font-size:10px;color:#bbb08f;line-height:1.7}.xp{height:5px;background:#0a0e0c}.xp i{display:block;height:100%;background:#b99450}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:7px}.play,.delete,.add-character{font:bold 10px Georgia;padding:11px;border:1px solid #887044;background:#252d28;color:#e7c983}.play{background:linear-gradient(#4b583a,#263126);border-color:#bd9148}.empty-slot{min-height:170px;display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;padding:14px;background:#202824e8;border:2px dashed #856d42;cursor:pointer}.empty-slot span{display:block;font-size:10px;color:#a99b7b;margin-top:5px}.empty-icon{width:76px;height:76px;border:1px solid #8d764b;display:grid;place-items:center;font-size:38px}.carousel-nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center;color:#c9aa68;font-size:11px}.carousel-nav button{height:38px;border:0;background:transparent;color:#d4b26d;font-size:28px}.add-character{width:100%;height:48px}.add-character small{display:block;font-size:8px;font-weight:normal;color:#a99a78;margin-top:2px}.studio-mark{position:fixed;z-index:9;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:clamp(70px,19vw,112px);height:68px;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}.studio-mark img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #000e);opacity:.92}.confirm{position:fixed;z-index:20;inset:0;background:#000c;display:none;place-items:center}.confirm.open{display:grid}.dialog{width:min(90vw,350px);background:#18201d;border:2px solid #8b7143;padding:20px;text-align:center}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:420px){.character-card{min-height:210px;grid-template-columns:42% 1fr}.avatar{height:160px}.char-info h3{font-size:20px}}</style></head><body><main class="page"><div class="shell"><div class="top"><a class="back" href="index.html">← ACCUEIL</a><button id="logout" class="logout">DÉCONNEXION</button></div><img class="logo" src="Logo-titre.png" alt="Survival"><h1>Quai des aventuriers</h1><p id="welcome" class="welcome">Chargement de tes personnages...</p><div id="characterList" class="slots"></div></div><footer class="studio-mark"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></main><div id="confirmDelete" class="confirm"><div class="dialog"><h2>Supprimer ce personnage ?</h2><p>Sa progression sera définitivement perdue. Les autres personnages ne seront pas touchés.</p><div
