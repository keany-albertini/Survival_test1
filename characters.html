<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Collection</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#080402;color:#fff0c7}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:16px 13px}.page:before{content:"";position:absolute;inset:0;background:linear-gradient(#02010155,#06111bd0),radial-gradient(circle at 50% 25%,transparent,#0008)}.shell{position:relative;z-index:1;width:min(94vw,470px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.back{color:#f2c66e;text-decoration:none;font-size:12px}.logo{display:block;width:min(74vw,340px);max-height:24vh;object-fit:contain;margin:0 auto 2px;filter:drop-shadow(0 8px 10px #000c)}.panel{background:linear-gradient(180deg,#102e49f2,#071a2df5);border:2px solid #c08740;box-shadow:0 12px 30px #000d,inset 0 0 0 3px #06111c,inset 0 0 0 5px #80532a;padding:18px 16px;clip-path:polygon(3% 0,97% 0,100% 3%,100% 97%,97% 100%,3% 100%,0 97%,0 3%)}h1{margin:0;text-align:center;font-size:25px;color:#ffe7a0}.muted{text-align:center;color:#cdbd9d;font-size:12px}.character-grid{display:grid;gap:9px;margin:15px 0}.creator{border-top:1px solid #9d713b;margin-top:15px;padding-top:13px}.creator h2{font-size:18px;color:#f3c76e}.field{margin:10px 0}.field label{display:block;font-size:9px;letter-spacing:1.3px;color:#e6b96a;margin-bottom:5px}.field input{width:100%;height:43px;border:1px solid #8c673c;background:#061522e8;color:#fff5d8;border-radius:3px;padding:0 11px;outline:none}.submit,.secondary{font-family:inherit;font-weight:700;color:#fff0c7;border:1px solid #c58a3d;background:linear-gradient(#173a59,#071b30);box-shadow:inset 0 0 0 2px #06101a,inset 0 0 0 3px #8c5c2c;min-height:44px}.submit{width:100%;margin-top:6px}.char-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.secondary{font-size:11px}.message{font-size:12px;text-align:center;margin-top:8px}.studio{text-align:center;margin-top:12px;color:#d9b56f;font-size:9px;letter-spacing:2px}.studio strong{display:block;font-size:14px;letter-spacing:4px;color:#ffe6a4}@media(max-height:700px){.logo{max-height:18vh}.panel{padding-top:13px}}</style></head><body><main class="page"><div class="shell"><div class="top"><a class="back" href="index.html">← ACCUEIL</a></div><img class="logo" src="Logo-titre.png" alt="Survival"><section class="panel"><h1>Ta collection</h1><p id="welcome" class="muted">Chargement de ton camp...</p><div id="characterList" class="character-grid"></div><div id="creator" class="creator" style="display:none"><h2>Nouveau survivant</h2><div class="field"><label>NOM DU PERSONNAGE</label><input id="characterName" maxlength="18" minlength="2" placeholder="Ex. Kael"></div><div class="field"><label>SPÉCIALITÉ</label><input id="characterStyle" maxlength="24" placeholder="Explorateur, chasseur, bâtisseur..."></div><button id="saveCharacter" class="submit">CRÉER LE PERSONNAGE</button><div id="characterMessage" class="message"></div></div><div class="char-actions"><button id="newCharacter" class="secondary">＋ NOUVEAU</button><button id="logout" class="secondary">DÉCONNEXION</button></div></section><footer class="studio">UN JEU PAR<strong>NINI CORPORATION</strong></footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="characters.js"></script></body></html>
