<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival — Nouveau mot de passe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px 18px 90px;background:#06121d url('tavern-bg.png') center/cover;color:#f8ddb0;font-family:Georgia,serif}main{width:min(92vw,420px);padding:24px 20px;background:#071c2def;border:2px solid #c99343;box-shadow:0 12px 35px #000}.game-logo{display:block;width:min(80vw,320px);max-height:180px;object-fit:contain;margin:auto}h1{text-align:center;color:#f1c66e;font-size:22px}p{text-align:center;font-size:12px;color:#d4c29f}input,button{width:100%;height:48px;margin-top:10px}input{background:#04131f;color:#fff;border:1px solid #936638;padding:0 12px}button{font-family:inherit;font-weight:bold;color:#fff0c7;border:2px solid #d19a48;background:#123c5d}#msg{min-height:20px;color:#ffd26c}.studio-mark{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:clamp(70px,19vw,112px);height:68px;display:flex;align-items:flex-end;justify-content:flex-end}.studio-mark img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #000e);opacity:.92}</style></head><body><main><img class="game-logo" src="Logo-titre.png" alt="Survival"><h1>Nouveau mot de passe</h1><p>Choisis ton nouveau mot de passe pour reprendre ton aventure.</p><input id="p1" type="password" minlength="6" placeholder="Nouveau mot de passe"><input id="p2" type="password" minlength="6" placeholder="Confirmer le mot de passe"><button id="save">ENREGISTRER</button><p id="msg"></p></main><footer class="studio-mark"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>save.onclick=async()=>{msg.textContent='';if(p1.value.length<6){msg.textContent='6 caractères minimum.';return}if(p1.value!==p2.value){msg.textContent='Les mots de passe ne correspondent pas.';return}save.disabled=true;const {error}=await sb.auth.updateUser({password:p1.value});save.disabled=false;if(error){msg.textContent='Le lien est invalide ou a expiré.';return}msg.textContent='Mot de passe modifié ! Redirection...';setTimeout(()=>location.href='characters.html',1200)}</script></body></html>
