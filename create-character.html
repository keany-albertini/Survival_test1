<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Création</title><style>*{box-sizing:border-box}body{margin:0;background:#06131b;color:#f5dfad;font-family:Georgia,serif}.page{min-height:100dvh;padding:12px 12px 90px;background:linear-gradient(#05101b33,#02080dcc),url('tavern-bg.png') center/cover fixed}.shell{max-width:600px;margin:auto}.top{display:flex;justify-content:space-between}.back{color:#efc46d;text-decoration:none}.step{color:#e5bd68;font-size:10px}.logo{display:block;width:min(55vw,270px);max-height:115px;object-fit:contain;margin:-4px auto}.title{text-align:center;margin:0 0 8px;color:#f2cc78}.showcase{min-height:310px;display:grid;grid-template-columns:58% 42%;align-items:center;border:1px solid #8d7045;background:#08151bc9;overflow:hidden}.character{height:310px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero{width:100%;height:100%;object-fit:cover;display:block;filter:drop-shadow(0 14px 10px #000)}.arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:48px;height:62px;border:1px solid #c49a50;background:linear-gradient(135deg,#3c3325e8,#121713ed 58%,#090d0ceb);color:#ffe09a;font-size:0;box-shadow:inset 0 0 0 2px #1b211c,inset 0 0 15px #d29c3426,0 6px 15px #000b;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s ease}.arrow:before{content:'';width:13px;height:13px;border-top:3px solid #f0c56d;border-right:3px solid #f0c56d;filter:drop-shadow(0 0 4px #d89c36)}.arrow:after{content:'';position:absolute;inset:5px;border:1px solid #8e713e66;pointer-events:none}.arrow.prev{left:7px;clip-path:polygon(30% 0,100% 0,100% 100%,30% 100%,0 50%)}.arrow.next{right:7px;clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%)}.arrow.prev:before{transform:rotate(-135deg);margin-left:7px}.arrow.next:before{transform:rotate(45deg);margin-right:7px}.arrow:active{transform:translateY(-50%) scale(.91);filter:brightness(1.3)}.carousel{margin-top:10px;display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}.car-arrow{position:relative;width:40px;height:58px;padding:0;border:1px solid #a88346;background:linear-gradient(145deg,#30291f,#111713 65%);color:transparent;box-shadow:inset 0 0 0 2px #1b211c,0 5px 12px #0009;clip-path:polygon(20% 0,80% 0,100% 18%,100% 82%,80% 100%,20% 100%,0 82%,0 18%)}.car-arrow:before{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;border-top:3px solid #eac16c;border-right:3px solid #eac16c;filter:drop-shadow(0 0 4px #d89c36)}#prevPage:before{transform:translate(-35%,-50%) rotate(-135deg)}#nextPage:before{transform:translate(-65%,-50%) rotate(45deg)}.car-arrow:active{transform:scale(.9);filter:brightness(1.35)}.info{margin-right:9px;padding:13px;background:#071014df;border:1px solid #77613e;position:relative;z-index:2}.info h2{font-size:27px;margin:0;color:#fff0c5}.info p{font-size:10px;line-height:1.45;color:#c9bea4}.bonus{border-top:1px solid #816b44;padding-top:8px;color:#e4bb6c;font-size:10px;line-height:1.8}.race-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.race{height:96px;padding:3px;background:#14221fdd;border:1px solid #705f40;color:#d7c79d;font:8px Georgia;overflow:hidden}.race img{display:block;width:100%;height:70px;object-fit:cover;border:1px solid #4e4532;margin-bottom:3px}.race span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.race.active{border:2px solid #f0b947;color:#ffe2a0;background:#34453d;box-shadow:0 0 14px #eeb44480}.race.active img{border-color:#f0b947}.dots{text-align:center;color:#745f3e}.dots .on{color:#f0b94d}.wizard{margin-top:9px;padding:12px;background:#071411e8;border:1px solid #846b43}.wizard-panel{display:none}.wizard-panel.active{display:block}.panel-title{color:#edc574;font-size:14px;margin:0 0 8px}.field label{display:block;font-size:9px;color:#c9a65f;margin:8px 0 4px}.field input,.field select{width:100%;height:43px;background:#0d1917;border:1px solid #65583d;color:#f5dfb1;padding:0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{height:44px;background:#15221e;border:1px solid #6d5b3d;color:#d9bd82}.choice.active{border:2px solid #e6b450;color:#ffe1a0;background:#35483d}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.nav button,.create{height:49px;border:1px solid #bd9148;background:#26352a;color:#f4d48e;font:bold 11px Georgia}.create{width:100%;border:2px solid #d5a54f;background:linear-gradient(#56633f,#253124);font-size:13px}.message{text-align:center;font-size:10px}.studio{position:fixed;right:9px;bottom:7px;width:92px;height:63px}.studio img{width:100%;height:100%;object-fit:contain}@media(max-width:430px){.showcase{min-height:275px;grid-template-columns:57% 43%}.character{height:275px}.info{padding:9px}.info h2{font-size:22px}.race{height:88px}.race img{height:63px}.arrow{width:43px;height:56px}}</style></head><body><main class="page"><div class="shell"><div class="top"><a class="back" href="characters.html">← RETOUR AU QUAI</a><span id="stepLabel" class="step">ÉTAPE 1/3 ● ○ ○</span></div><img class="logo" src="Logo-titre.png"><h1 id="mainTitle" class="title">CHOISIS TA RACE</h1><section class="showcase"><div class="character"><button id="prevRace" class="arrow prev" aria-label="Race précédente">‹</button><img id="heroIcon" class="hero" src="Humain.png" alt="Humain"><button id="nextRace" class="arrow next" aria-label="Race suivante">›</button></div><aside class="info"><h2 id="raceTitle">Humain</h2><p id="raceDesc"></p><div class="bonus"><b>BONUS DE RACE</b><div id="raceTraits"></div><div>NIVEAU 1 • 0 XP</div></div></aside></section><div id="raceChooser"><section class="carousel"><button id="prevPage" class="car-arrow" aria-label="Races précédentes">‹</button><div id="raceGrid" class="race-grid"></div><button id="nextPage" class="car-arrow" aria-label="Races suivantes">›</button></section><div class="dots"><span id="dot0" class="on">●</span> <span id="dot1">●</span></div></div><section class="wizard"><div id="panel1" class="wizard-panel active"><h2 class="panel-title">1. RACE</h2><p>Choisis la race de base de ton aventurier. Tu pourras ensuite modifier son apparence.</p><div class="nav"><span></span><button id="toStep2">PERSONNALISER →</button></div></div><div id="panel2" class="wizard-panel"><h2 class="panel-title">2. PERSONNALISATION — <span id="selectedLabel">HUMAIN</span></h2><div class="field"><label>SEXE</label><div class="choices"><button class="choice active" data-sex="Homme">♂ HOMME</button><button class="choice" data-sex="Femme">♀ FEMME</button></div><select id="characterSex" hidden><option>Homme</option><option>Femme</option></select></div><div class="row"><div class="field"><label>PEAU</label><select id="skinTone"><option value="clair">Claire</option><option value="medium" selected>Moyenne</option><option value="fonce">Foncée</option></select></div><div class="field"><label>CHEVEUX</label><select id="hairStyle"><option value="court">Courts</option><option value="long">Longs</option><option value="rase">Rasé</option><option value="tresses">Tresses</option></select></div><div class="field"><label>COULEUR</label><select id="hairColor"><option value="brun">Brun</option><option value="noir">Noir</option><option value="blond">Blond</option><option value="roux">Roux</option><option value="blanc">Blanc</option></select></div><div class="field"><label>YEUX</label><select id="eyeColor"><option value="marron">Marron</option><option value="bleu">Bleu</option><option value="vert">Vert</option><option value="gris">Gris</option><option value="ambre">Ambre</option></select></div></div><div class="nav"><button id="back1">← RACE</button><button id="toStep3">IDENTITÉ →</button></div></div><div id="panel3" class="wizard-panel"><h2 class="panel-title">3. IDENTITÉ</h2><div class="field"><label>NOM</label><input id="characterName" maxlength="18" minlength="2" placeholder="Nom du personnage"></div><div class="field"><label>STYLE</label><select id="characterStyle"><option>Explorateur</option><option>Chasseur</option><option>Bâtisseur</option><option>Guerrier</option></select></div><div class="nav"><button id="back2">← APPARENCE</button><button id="createCharacter" class="create">CRÉER →</button></div><div id="message" class="message"></div></div></section></div><footer class="studio"><img src="nini-pepita-logo.png?v=2"></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="create-character.js?v=71"></script></body></html>
