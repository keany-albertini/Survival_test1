<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Créer un personnage</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:#031019;color:#f2ddb0}.page{position:relative;min-height:100dvh;overflow:hidden;background:linear-gradient(#08263a55,#020609c9),url('tavern-bg.png') center/cover fixed no-repeat;padding:12px 12px 90px}.water{position:fixed;left:-10%;right:-10%;bottom:-2%;height:32%;background:repeating-linear-gradient(175deg,#7fc6d014 0 2px,#061d2a22 3px 9px);animation:water 5s ease-in-out infinite alternate;pointer-events:none}.boat{position:fixed;right:-15px;top:19%;font-size:80px;opacity:.18;filter:drop-shadow(0 8px 5px #000);animation:boat 4s ease-in-out infinite}.mist{position:fixed;inset:0;background:radial-gradient(ellipse at 15% 60%,#d8e6df12,transparent 34%),radial-gradient(ellipse at 80% 45%,#fff0c20d,transparent 30%);animation:mist 9s ease-in-out infinite alternate;pointer-events:none}.lantern{position:fixed;width:8px;height:8px;border-radius:50%;background:#ffd06b;box-shadow:0 0 10px 4px #ff9e3266;animation:flicker 1.6s infinite alternate}.l1{left:8%;top:31%}.l2{right:12%;top:37%;animation-delay:.7s}.shell{position:relative;z-index:2;width:min(96vw,590px);margin:auto}.back{color:#f0c86f;text-decoration:none;font-size:11px;text-shadow:0 2px 4px #000}.logo{display:block;width:min(58vw,275px);max-height:14vh;object-fit:contain;margin:-3px auto}.title{text-align:center;margin:0;color:#f5d58e;font-size:24px;text-shadow:0 3px 8px #000}.stage{position:relative;min-height:190px;margin:7px 0 10px;display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;background:linear-gradient(90deg,#06131a99,#0d2731bb,#06131a99);border-top:1px solid #9b7949;border-bottom:1px solid #9b7949;overflow:hidden}.stage:after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:28px;background:#080d0c;border-top:4px solid #6d4a2a;transform:perspective(100px) rotateX(25deg)}.race-info{padding:10px;z-index:2}.race-info h2{margin:0;color:#ffd98c;font-size:21px}.race-info p{font-size:10px;line-height:1.4;color:#c9bfa5}.traits{font-size:9px;color:#e0b966}.hero-char{z-index:2;text-align:center;animation:breathe 3.2s ease-in-out infinite}.hero-icon{font-size:83px;line-height:1;filter:drop-shadow(0 7px 8px #000);transition:.25s}.hero-char strong{display:block;margin-top:6px;color:#f4cc78;font-size:11px;letter-spacing:1px}.panel{position:relative;background:#0b1717e8;border:1px solid #927348;padding:12px;box-shadow:0 12px 30px #000d}.label{font-size:9px;letter-spacing:1.2px;color:#d6b36c;margin:9px 0 5px}.races{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 8px;scroll-snap-type:x mandatory}.race{flex:0 0 75px;min-height:70px;scroll-snap-align:center;background:#202925e8;border:1px solid #66583c;color:#bfb18d;font:8px Georgia;padding:5px 2px;transition:.2s}.race b{display:block;font-size:26px;margin-bottom:3px}.race.active{transform:translateY(-3px) scale(1.04);border:2px solid #e3b85e;color:#ffe3a0;background:#435045;box-shadow:0 0 14px #e3ae4d4d}.field input,.field select{width:100%;height:42px;background:#071210dd;border:1px solid #6f5c3c;color:#f3dfb2;padding:0 10px}.row,.appearance{display:grid;grid-template-columns:1fr 1fr;gap:7px}.appearance-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease}.appearance-wrap.open{max-height:180px}.toggle{width:100%;height:36px;background:#16241f;border:1px solid #705d3d;color:#d8b971;font:bold 10px Georgia}.create{width:100%;min-height:49px;margin-top:13px;background:linear-gradient(#675536,#2d2c23);border:2px solid #c59a51;color:#ffe0a0;font:bold 13px Georgia;box-shadow:0 5px 15px #000b}.message,.note{text-align:center;font-size:10px}.studio-mark{position:fixed;z-index:9;right:10px;bottom:8px;width:clamp(70px,19vw,112px);height:68px}.studio-mark img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #000e)}@keyframes water{to{transform:translateY(8px) translateX(3%)}}@keyframes boat{50%{transform:rotate(2deg) translateY(6px)}}@keyframes mist{to{transform:translateX(4%)}}@keyframes flicker{to{opacity:.55;transform:scale(.8)}}@keyframes breathe{50%{transform:translateY(-4px) scale(1.015)}}@media(max-width:410px){.stage{grid-template-columns:1fr 105px 1fr;min-height:165px}.hero-icon{font-size:70px}.race-info p{font-size:9px}}</style></head><body><main class="page"><div class="water"></div><div class="boat">⛵</div><div class="mist"></div><i class="lantern l1"></i><i class="lantern l2"></i><div class="shell"><a class="back" href="characters.html">← RETOUR AU QUAI</a><img class="logo" src="Logo-titre.png" alt="Survival"><h1 class="title">Crée ton aventurier</h1><section class="stage"><div class="race-info"><h2 id="raceTitle">Humain</h2><p id="raceDesc">Polyvalent et adaptable, prêt à survivre partout.</p><div id="raceTraits" class="traits">ÉQUILIBRE • ADAPTATION</div></div><div class="hero-char"><div id="heroIcon" class="hero-icon">♙</div><strong id="heroRace">HUMAIN</strong></div><div class="race-info"><p>Ton personnage prend vie sur le quai avant le départ.</p><div class="traits">NIVEAU 1 • 0 XP</div></div></section><section class="panel"><div class="label">CHOISIS TA RACE</div><div class="races"><button class="race active" data-race="Humain"><b>♙</b>HUMAIN</button><button class="race" data-race="Elfe"><b>♞</b>ELFE</button><button class="race" data-race="Ogre"><b>♜</b>OGRE</button><button class="race" data-race="Gnome"><b>♟</b>GNOME</button><button class="race" data-race="Nain"><b>⚒</b>NAIN</button><button class="race" data-race="Orc"><b>⚔</b>ORC</button><button class="race" data-race="Lycan"><b>☾</b>LYCAN</button><button class="race" data-race="Drakéide"><b>♨</b>DRAKÉIDE</button></div><div class="field"><div class="label">NOM</div><input id="characterName" maxlength="18" minlength="2" placeholder="Nom du personnage"></div><div class="row"><div class="field"><div class="label">SEXE</div><select id="characterSex"><option>Homme</option><option>Femme</option></select></div><div class="field"><div class="label">STYLE</div><select id="characterStyle"><option>Explorateur</option><option>Chasseur</option><option>Bâtisseur</option><option>Guerrier</option></select></div></div><div class="label">PERSONNALISATION</div><button type="button" id="appearanceToggle" class="toggle">⚙ OUVRIR L'APPARENCE</button><div id="appearanceWrap" class="appearance-wrap"><div class="appearance"><div class="field"><select id="skinTone"><option value="clair">Peau claire</option><option value="medium" selected>Peau moyenne</option><option value="fonce">Peau foncée</option></select></div><div class="field"><select id="hairStyle"><option value="court">Cheveux courts</option><option value="long">Cheveux longs</option><option value="rase">Rasé</option><option value="tresses">Tresses</option></select></div><div class="field"><select id="hairColor"><option value="brun">Cheveux bruns</option><option value="noir">Cheveux noirs</option><option value="blond">Cheveux blonds</option><option value="roux">Cheveux roux</option><option value="blanc">Cheveux blancs</option></select></div><div class="field"><select id="eyeColor"><option value="marron">Yeux marron</option><option value="bleu">Yeux bleus</option><option value="vert">Yeux verts</option><option value="gris">Yeux gris</option><option value="ambre">Yeux ambre</option></select></div></div></div><button id="createCharacter" class="create">EMBARQUER AVEC CE PERSONNAGE</button><div id="message" class="message"></div><p class="note">Chaque aventurier commence niveau 1 avec 0 XP.</p></section></div><footer class="studio-mark"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="create-character.js"></script></body></html>
