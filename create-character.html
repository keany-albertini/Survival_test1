<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Créer un personnage</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#05090c;color:#f2ddb0}.page{min-height:100dvh;background:linear-gradient(#06101877,#020605e8),url('tavern-bg.png') center/cover fixed no-repeat;padding:12px}.shell{width:min(95vw,560px);margin:auto}.back{color:#d9b76d;text-decoration:none;font-size:11px}.logo{display:block;width:min(67vw,310px);max-height:17vh;object-fit:contain;margin:-5px auto 0}.title{text-align:center;margin:2px 0 12px;color:#f0d08a;font-size:25px}.panel{background:#121a17ed;border:2px solid #816b42;padding:14px;box-shadow:0 12px 30px #000d}.label{font-size:9px;letter-spacing:1.2px;color:#c8a964;margin:11px 0 5px}.races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.race{min-height:68px;background:#222b26;border:1px solid #66583c;color:#bfb18d;font:9px Georgia;padding:5px 2px}.race b{display:block;font-size:25px;margin-bottom:3px}.race.active{border:2px solid #d0a85e;color:#ffe1a0;background:#3b443b;box-shadow:inset 0 0 10px #000}.field input,.field select{width:100%;height:43px;background:#0b1210;border:1px solid #65583d;color:#f3dfb2;padding:0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.appearance{display:grid;grid-template-columns:1fr 1fr;gap:8px}.create{width:100%;min-height:48px;margin-top:15px;background:linear-gradient(#4a4d42,#252923);border:2px solid #9c7c47;color:#f1d18a;font:bold 13px Georgia;letter-spacing:1px}.message{text-align:center;font-size:11px;margin-top:8px;color:#d5aa8d}.note{text-align:center;font-size:10px;color:#a89d82;margin:8px 0 0}@media(max-width:380px){.races{grid-template-columns:repeat(4,1fr)}.race{font-size:8px}}</style></head><body><main class="page"><div class="shell"><a class="back" href="characters.html">← RETOUR AU QUAI</a><img class="logo" src="Logo-titre.png" alt="Survival"><h1 class="title">Créer un personnage</h1><section class="panel"><div class="label">CHOISIS TA RACE</div><div class="races"><button class="race active" data-race="Humain"><b>♙</b>HUMAIN</button><button class="race" data-race="Elfe"><b>♞</b>ELFE</button><button class="race" data-race="Ogre"><b>♜</b>OGRE</button><button class="race" data-race="Gnome"><b>♟</b>GNOME</button><button class="race" data-race="Nain"><b>⚒</b>NAIN</button><button class="race" data-race="Orc"><b>⚔</b>ORC</button><button class="race" data-race="Lycan"><b>☾</b>LYCAN</button><button class="race" data-race="Drakéide"><b>♨</b>DRAKÉIDE</button></div><div class="field"><div class="label">NOM</div><input id="characterName" maxlength="18" minlength="2" placeholder="Nom du personnage"></div><div class="row"><div class="field"><div class="label">SEXE</div><select id="characterSex"><option>Homme</option><option>Femme</option></select></div><div class="field"><div class="label">STYLE</div><select id="characterStyle"><option>Explorateur</option><option>Chasseur</option><option>Bâtisseur</option><option>Guerrier</option></select></div></div><div class="label">APPARENCE</div><div class="appearance"><div class="field"><select id="skinTone"><option value="clair">Peau claire</option><option value="medium" selected>Peau moyenne</option><option value="fonce">Peau foncée</option></select></div><div class="field"><select id="hairStyle"><option value="court">Cheveux courts</option><option value="long">Cheveux longs</option><option value="rase">Rasé</option><option value="tresses">Tresses</option></select></div><div class="field"><select id="hairColor"><option value="brun">Cheveux bruns</option><option value="noir">Cheveux noirs</option><option value="blond">Cheveux blonds</option><option value="roux">Cheveux roux</option><option value="blanc">Cheveux blancs</option></select></div><div class="field"><select id="eyeColor"><option value="marron">Yeux marron</option><option value="bleu">Yeux bleus</option><option value="vert">Yeux verts</option><option value="gris">Yeux gris</option><option value="ambre">Yeux ambre</option></select></div></div><button id="createCharacter" class="create">CRÉER MON PERSONNAGE</button><div id="message" class="message"></div><p class="note">Chaque nouveau personnage commence niveau 1 avec 0 XP.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="create-character.js"></script></body></html>
