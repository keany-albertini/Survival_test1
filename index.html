<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0502;color:#f4ddb0;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.home:before{content:"";position:absolute;inset:0;background:linear-gradient(#05020042,#08030118 55%,#05020050),radial-gradient(circle at 50% 42%,transparent 20%,#0007 100%)}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;right:15px;top:max(16px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #c49a5d;background:#1b100bd9;color:#f1d29b;font-size:22px;box-shadow:0 3px 12px #000b,inset 0 0 0 3px #654321}.hero{margin-top:clamp(65px,11vh,105px);display:flex;flex-direction:column;align-items:center}.nautical{position:relative;width:112px;height:90px;margin-bottom:-22px}.wheel{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80px;height:80px;border:7px double #b27b3d;border-radius:50%;background:#28160bd9;box-shadow:0 4px 10px #000}.wheel:before{content:"✦";position:absolute;inset:15px;border:2px solid #8e5e30;border-radius:50%;display:grid;place-items:center;color:#c69759;font-size:22px}.anchor{position:absolute;z-index:2;left:50%;top:4px;transform:translateX(-50%);font-size:59px;line-height:1;color:#e0b56f;filter:drop-shadow(0 3px 2px #321b0b)}h1{position:relative;margin:0;padding:3px 16px 6px;font-size:clamp(49px,16vw,78px);line-height:.92;letter-spacing:-2px;background:linear-gradient(#fff1ca,#d6aa69 38%,#835126 62%,#edc988 82%,#75451f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #3d210e;filter:drop-shadow(0 4px 0 #281408) drop-shadow(0 8px 8px #000)}.tagline{margin-top:10px;font-size:clamp(8px,2.5vw,11px);font-weight:700;letter-spacing:1.7px;color:#e5bd79}.menu{width:min(76vw,320px);display:grid;gap:10px;margin-top:clamp(30px,5vh,50px)}.btn{position:relative;min-height:49px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#f8e4bd;font-size:clamp(13px,3.7vw,16px);font-weight:700;letter-spacing:.5px;border:2px solid #a96f37;background:linear-gradient(180deg,#56321ef2,#301a0ff5 55%,#1d0e08f7);box-shadow:0 5px 12px #000b,inset 0 0 0 3px #160b06,inset 0 0 0 4px #8c5d32;clip-path:polygon(5% 0,95% 0,100% 25%,100% 75%,95% 100%,5% 100%,0 75%,0 25%)}.btn:before,.btn:after{content:"◆";position:absolute;color:#c58e4d;font-size:7px}.btn:before{left:10px}.btn:after{right:10px}.btn:active{transform:translateY(2px);filter:brightness(1.18)}.ico{font-size:18px;color:#e0b06c}.discover{background:linear-gradient(180deg,#4c2d1bf2,#25150cf7)}@media(max-height:690px){.hero{margin-top:48px}.nautical{transform:scale(.82);margin-bottom:-27px}.menu{margin-top:22px;gap:8px}.btn{min-height:44px}}@media(min-width:700px){.menu{width:330px}.hero{margin-top:75px}}</style></head><body><main class="home"><div class="ui"><button class="music" id="music" aria-label="Musique">♪</button><header class="hero"><div class="nautical"><div class="wheel"></div><div class="anchor">⚓</div></div><h1>SURVIVAL</h1><div class="tagline">EXPLORER · SURVIVRE · CONSTRUIRE · ÉVOLUER</div></header><nav class="menu"><a class="btn" href="login.html"><span class="ico">♙</span>Se connecter</a><a class="btn" href="login.html?mode=register"><span class="ico">♙＋</span>S'inscrire</a><a class="btn discover" href="world.html"><span class="ico">✥</span>Découvrir le jeu</a></nav></div></main><script>const b=document.getElementById('music');let a=null,on=false;b.onclick=async()=>{if(!a){a=new Audio('tavern-theme.mp3');a.loop=true;a.volume=.32}try{if(on){a.pause();on=false;b.textContent='♪'}else{await a.play();on=true;b.textContent='♫'}}catch(e){on=false;b.textContent='♪'}};</script></body></html>
