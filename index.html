// Deterministic, tileable multi-scale ground texture, generated locally (no downloads).
function groundTexture(){
 const size=512, canvas=document.createElement('canvas');canvas.width=canvas.height=size;
 const ctx=canvas.getContext('2d'), data=ctx.createImageData(size,size);
 let seed=1827;const noise=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
 const coarse=new Float32Array(64*64);for(let i=0;i<coarse.length;i++)coarse[i]=noise();
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
   const ix=(x>>3)&63,iy=(y>>3)&63,fx=(x&7)/8,fy=(y&7)/8;
   const at=(a,b)=>coarse[((b&63)*64)+(a&63)];
   const a=at(ix,iy)*(1-fx)+at(ix+1,iy)*fx,b=at(ix,iy+1)*(1-fx)+at(ix+1,iy+1)*fx;
   const n=(a*(1-fy)+b*fy),grain=noise(),d=(y*size+x)*4;

   data.data[d]=Math.max(0,Math.min(255,(dirt?99:69)+v));
   data.data[d+1]=Math.max(0,Math.min(255,(dirt?88:92)+v));
   data.data[d+2]=Math.max(0,Math.min(255,(dirt?70:56)+v*.8));
   data.data[d+3]=255;
 }

 const texture=new THREE.CanvasTexture(canvas);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(34,34);texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return texture;
}
// Lightweight generated material details. Reused by all boulders and trunks.
function organicTexture(type){
 const cv=document.createElement('canvas');cv.width=cv.height=256;
 const cx=cv.getContext('2d'),im=cx.createImageData(256,256);
 let seed=type==='stone'?14723:8764;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 const base=type==='stone'?[118,125,120]:[94,69,47];
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){
   const grain=(random()-.5)*47,streak=type==='bark'?Math.sin(x*.44+Math.sin(y*.09)*2)*22:Math.sin(x*.1+y*.17)*9;
   const v=grain+streak,idx=(y*256+x)*4;
   im.data[idx]=Math.max(0,Math.min(255,base[0]+v));
   im.data[idx+1]=Math.max(0,Math.min(255,base[1]+v*.85));
   im.data[idx+2]=Math.max(0,Math.min(255,base[2]+v*.76));im.data[idx+3]=255;
 }

}
const blockers=[];

}

const green=new THREE.MeshStandardMaterial({color:0x526849,roughness:1}),earth=new THREE.MeshStandardMaterial({color:0x6d6655,roughness:1}),rock=new THREE.MeshStandardMaterial({map:organicTexture('stone'),roughness:.99,flatShading:true}),bark=new THREE.MeshStandardMaterial({map:organicTexture('bark'),roughness:1}),leaf=[0x294e37,0x365b40,0x497047].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true}));const moss=new THREE.MeshStandardMaterial({color:0x748251,roughness:1});

let seed=18299;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}

// Organic procedural geometry: tapered branch clusters and irregular boulders.
const trunkGeo=new THREE.CylinderGeometry(.2,.5,6,9);
function irregularRock(){
 const g=new THREE.IcosahedronGeometry(1,1),p=g.attributes.position;
 for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);

}
const treeCrown=new THREE.IcosahedronGeometry(1,1),branchGeo=new THREE.CylinderGeometry(.04,.12,1,5);

const grassGeometry=new THREE.BufferGeometry();grassGeometry.setAttribute('position',new THREE.Float32BufferAttribute([-.11,0,0,.11,0,0,.035,.8,0, -.09,0,.03,.09,0,.03,-.025,.62,.03],3));grassGeometry.computeVertexNormals();

 const x=(rand()-.5)*355,z=(rand()-.5)*355,scale=.4+rand()*.8;

for(let i=0;i<190;i++){let x=(rand()-.5)*390,z=(rand()-.5)*390;if(Math.hypot(x,z)<18)continue;let y=h(x,z),s=.7+rand()*1.45;const trunk=mesh(trunkGeo,bark,x,y+3*s,z);trunk.scale.set(s,s,s);addBlocker(x,z,.38*s);for(let j=0;j<7;j++){
 const angle=rand()*Math.PI*2, spread=(1.15+rand()*1.2)*s, level=(4.4+rand()*3.5)*s;
 const bx=x+Math.cos(angle)*spread,bz=z+Math.sin(angle)*spread;

 const canopy=mesh(treeCrown,leaf[Math.floor(rand()*leaf.length)],bx,y+level,bz);canopy.rotation.set(rand()*.35,rand()*6,rand()*.35);

 }}
const rocks=[irregularRock(),irregularRock()];for(let i=0;i<270;i++){let x=(rand()-.5)*400,z=(rand()-.5)*400; if(Math.hypot(x,z)<9)continue;let s=.2+rand()*1.9;let o=mesh(rocks[i%2],rock,x,h(x,z)+s*.35,z);o.scale.set(s*1.4,s*.8,s);o.rotation.set(rand()*2,rand()*6,rand());addBlocker(x,z,s*1.1);}
// Procedural scattered stones and woodland debris.
const pebbleMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),rock,650);
for(let i=0;i<650;i++){
 const x=(rand()-.5)*350,z=(rand()-.5)*350,k=.035+rand()*.14;
 matrixDummy.position.set(x,h(x,z)+k*.28,z);
 matrixDummy.rotation.set(rand()*2,rand()*6,rand());
 matrixDummy.scale.set(k*1.8,k*.55,k*1.4);matrixDummy.updateMatrix();

}
pebbleMesh.instanceMatrix.needsUpdate=true;pebbleMesh.frustumCulled=false;scene.add(pebbleMesh);
// Low-cost procedural warm forest floor details, batched as instanced meshes.
const fallenLogMat=new THREE.MeshStandardMaterial({map:organicTexture('bark'),roughness:1});
const deadwood=new THREE.InstancedMesh(new THREE.CylinderGeometry(.075,.11,1.8,6),fallenLogMat,85);
for(let i=0;i<85;i++){const x=(rand()-.5)*345,z=(rand()-.5)*345,angle=rand()*6.28;
 matrixDummy.position.set(x,h(x,z)+.12,z);matrixDummy.rotation.set(Math.PI/2,angle,0);
 matrixDummy.scale.set(.7+rand(),.7+rand()*1.4,.7+rand());
 matrixDummy.updateMatrix();deadwood.setMatrixAt(i,matrixDummy.matrix);
}deadwood.instanceMatrix.needsUpdate=true;deadwood.frustumCulled=false;scene.add(deadwood);
const settings=document.createElement('div');settings.style.cssText='position:absolute;right:12px;top:12px;background:#06131acc;padding:7px 9px;border-radius:9px;font:11px system-ui;color:white;z-index:2;max-width:158px';settings.innerHTML='<label>Caméra <input id="sensitivity" type="range" min="1" max="10" value="4" style="width:78px;vertical-align:middle"></label>';document.body.appendChild(settings);let sensitivity=.002;settings.querySelector('input').addEventListener('input',e=>{sensitivity=Number(e.target.value)*.0005});renderer.domElement.style.touchAction='none';document.body.style.overscrollBehavior='none';const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let yaw=.5,pitch=-.09,px=0,pz=7,jx=0,jy=0;const joystick=document.querySelector('#stick'),thumb=document.querySelector('#thumb');let stickId=null,lookId=null,lastX=0,lastY=0;
function stick(e){const b=joystick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),amount=Math.min(l,38);jx=dx/l*amount/38;jy=dy/l*amount/38;thumb.style.transform=`translate(${jx*38}px,${jy*38}px)`}

function resetStick(e){if(e.pointerId!==stickId)return;stickId=null;jx=jy=0;thumb.style.transform=''}

renderer.domElement.addEventListener('pointerdown',e=>{if(lookId!==null)return;e.preventDefault();lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(lookId!==e.pointerId)return;e.preventDefault();const dx=Math.max(-65,Math.min(65,e.clientX-lastX)),dy=Math.max(-65,Math.min(65,e.clientY-lastY));yaw-=dx*sensitivity;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*sensitivity));lastX=e.clientX;lastY=e.clientY});
function releaseLook(e){if(e.pointerId===lookId)lookId=null}

let prev=performance.now(),bobPhase=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min(.045,(now-prev)/1000);prev=now;const f=(keys.has('w')||keys.has('z')?1:0)-(keys.has('s')?1:0)-jy,side=(keys.has('d')?1:0)-(keys.has('a')||keys.has('q')?1:0)+jx;let magnitude=Math.max(1,Math.hypot(f,side)),speed=(keys.has('shift')?11:6)*dt;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed/magnitude,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed/magnitude;
