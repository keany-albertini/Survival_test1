<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Everwild | Aperçu 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#14212b;color:#eee;font-family:system-ui,sans-serif}canvas{display:block}#hud{position:absolute;left:14px;top:14px;padding:13px 16px;background:#06131ac9;border:1px solid #ffffff32;border-radius:10px;max-width:min(420px,92vw);pointer-events:none}h1{font-size:22px;letter-spacing:5px;margin:0 0 7px}small{opacity:.83;line-height:1.5;display:block}#badge{color:#dfc49b;font-size:11px;letter-spacing:2px;text-transform:uppercase}#stick{position:absolute;left:26px;bottom:30px;width:108px;height:108px;border-radius:60px;border:2px solid #fff7;background:#ffffff18;touch-action:none;user-select:none}#thumb{position:absolute;left:34px;top:34px;width:36px;height:36px;border-radius:50%;background:#ffffff8a}#hint{position:absolute;right:20px;bottom:31px;background:#06131ab0;padding:12px;border-radius:8px;font-size:12px;max-width:170px;pointer-events:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#182a31;z-index:5}#loading.hide{display:none}@media(min-width:800px){#stick{display:none}}</style></head>
<body><div id="loading">Chargement de l'environnement 3D…</div><div id="hud"><div id="badge">Prototype visuel • non contractuel</div><h1>EVERWILD</h1><small>Forêt des Premiers Âges · Textures et collisions V3</small><small>Vie 100 · Faim 100 · Soif 100</small></div><div id="stick"><div id="thumb"></div></div><div id="hint">Téléphone : joystick à gauche, glisser à droite pour regarder.<br>PC : ZQSD/WASD et souris.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9eb5bf);scene.fog=new THREE.FogExp2(0x93a5a5,.009);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc7dcea,0x54543c,2.0));const sun=new THREE.DirectionalLight(0xffe2ae,3.1);sun.position.set(-80,110,-70);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-115;sun.shadow.camera.right=115;sun.shadow.camera.top=115;sun.shadow.camera.bottom=-115;scene.add(sun);
// Deterministic, tileable multi-scale ground texture, generated locally (no downloads).
function groundTexture(){
 const size=512, canvas=document.createElement('canvas');canvas.width=canvas.height=size;
 const ctx=canvas.getContext('2d'), data=ctx.createImageData(size,size);
 let seed=1827;const noise=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
 const coarse=new Float32Array(64*64);for(let i=0;i<coarse.length;i++)coarse[i]=noise();
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
   const ix=(x>>3)&63,iy=(y>>3)&63,fx=(x&7)/8,fy=(y&7)/8;
   const at=(a,b)=>coarse[((b&63)*64)+(a&63)];
   const a=at(ix,iy)*(1-fx)+at(ix+1,iy)*fx,b=at(ix,iy+1)*(1-fx)+at(ix+1,iy+1)*fx;
   const n=(a*(1-fy)+b*fy),grain=noise(),d=(y*size+x)*4;
   const dirt=n<.37;const v=(n-.5)*38+(grain-.5)*40;
   data.data[d]=Math.max(0,Math.min(255,(dirt?99:69)+v));
   data.data[d+1]=Math.max(0,Math.min(255,(dirt?88:92)+v));
   data.data[d+2]=Math.max(0,Math.min(255,(dirt?70:56)+v*.8));
   data.data[d+3]=255;
 }
 ctx.putImageData(data,0,0);
 for(let i=0;i<5500;i++){ctx.fillStyle=noise()>.5?'#566846':'#998d6a';ctx.globalAlpha=.25+noise()*.35;ctx.fillRect(noise()*size,noise()*size,1+noise()*2,1+noise()*4)}
 ctx.globalAlpha=1;
 const texture=new THREE.CanvasTexture(canvas);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(34,34);texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return texture;
}
const blockers=[];
function blocked(x,z){for(const b of blockers){const dx=x-b.x,dz=z-b.z;if(dx*dx+dz*dz<(b.r+.35)*(b.r+.35))return true}return false}
const green=new THREE.MeshStandardMaterial({color:0x526849,roughness:1}),earth=new THREE.MeshStandardMaterial({color:0x6d6655,roughness:1}),rock=new THREE.MeshStandardMaterial({color:0x747976,roughness:.95,flatShading:true}),bark=new THREE.MeshStandardMaterial({color:0x594336,roughness:1}),leaf=[0x294e37,0x365b40,0x497047].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true}));const moss=new THREE.MeshStandardMaterial({color:0x748251,roughness:1});
const h=(x,z)=>Math.sin(x*.038)*Math.cos(z*.045)*5+Math.sin(x*.09+z*.063)*1.1+Math.cos(z*.012+x*.014)*3;
const grid=140, step=3;const verts=[],cols=[],indices=[];const c=new THREE.Color();for(let z=0;z<=grid;z++)for(let x=0;x<=grid;x++){let px=(x-grid/2)*step,pz=(z-grid/2)*step,y=h(px,pz);verts.push(px,y,pz);let v=Math.max(0,Math.min(1,(y+5)/21));c.setRGB(.16+v*.18,.24+v*.15,.13+v*.12);cols.push(c.r,c.g,c.b)}for(let z=0;z<grid;z++)for(let x=0;x<grid;x++){let a=z*(grid+1)+x,b=a+1,d=a+grid+1;indices.push(a,d,b,b,d,d+1)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.setIndex(indices);geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({map:groundTexture(),roughness:1});const terrain=new THREE.Mesh(geo,mat);terrain.receiveShadow=true;scene.add(terrain);
let seed=18299;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function mesh(geom,material,x,y,z){const m=new THREE.Mesh(geom,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
const trunkGeo=new THREE.CylinderGeometry(.2,.5,6,7),cones=[new THREE.ConeGeometry(3,5,7),new THREE.ConeGeometry(2.6,4.7,7),new THREE.ConeGeometry(2,4.3,7)];
for(let i=0;i<265;i++){let x=(rand()-.5)*390,z=(rand()-.5)*390;if(Math.hypot(x,z)<18)continue;let y=h(x,z),s=.7+rand()*1.45;const trunk=mesh(trunkGeo,bark,x,y+3*s,z);trunk.scale.set(s,s,s);blockers.push({x,z,r:.38*s});for(let j=0;j<3;j++){let canopy=mesh(cones[j],leaf[Math.floor(rand()*leaf.length)],x,y+(5.6+j*2.15)*s,z);canopy.scale.set(s,s,s)}}
const rocks=[new THREE.DodecahedronGeometry(1,1),new THREE.IcosahedronGeometry(1,0)];for(let i=0;i<340;i++){let x=(rand()-.5)*400,z=(rand()-.5)*400; if(Math.hypot(x,z)<9)continue;let s=.2+rand()*1.9;let o=mesh(rocks[i%2],rock,x,h(x,z)+s*.35,z);o.scale.set(s*1.4,s*.8,s);o.rotation.set(rand()*2,rand()*6,rand());blockers.push({x,z,r:s*1.1});}
for(let i=0;i<900;i++){let x=(rand()-.5)*350,z=(rand()-.5)*350,s=.15+rand()*.45;const tuft=mesh(new THREE.ConeGeometry(s,s*2,3),moss,x,h(x,z)+s*.7,z);tuft.rotation.z=(rand()-.5)*.8;tuft.castShadow=false;}
const settings=document.createElement('div');settings.style.cssText='position:absolute;right:12px;top:12px;background:#06131acc;padding:10px;border-radius:9px;font:12px system-ui;color:white;z-index:2';settings.innerHTML='<label>Sensibilité caméra <input id="sensitivity" type="range" min="1" max="10" value="4" style="width:92px;vertical-align:middle"></label>';document.body.appendChild(settings);let sensitivity=.002;settings.querySelector('input').addEventListener('input',e=>{sensitivity=Number(e.target.value)*.0005});renderer.domElement.style.touchAction='none';document.body.style.overscrollBehavior='none';const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let yaw=.5,pitch=-.09,px=0,pz=7,jx=0,jy=0;const joystick=document.querySelector('#stick'),thumb=document.querySelector('#thumb');let stickId=null,lookId=null,lastX=0,lastY=0;
function stick(e){const b=joystick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),amount=Math.min(l,38);jx=dx/l*amount/38;jy=dy/l*amount/38;thumb.style.transform=`translate(${jx*38}px,${jy*38}px)`}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();if(stickId!==null)return;stickId=e.pointerId;joystick.setPointerCapture(e.pointerId);stick(e)});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===stickId){e.preventDefault();stick(e)}});
function resetStick(e){if(e.pointerId!==stickId)return;stickId=null;jx=jy=0;thumb.style.transform=''}
joystick.addEventListener('pointerup',resetStick);joystick.addEventListener('pointercancel',resetStick);joystick.addEventListener('lostpointercapture',resetStick);
renderer.domElement.addEventListener('pointerdown',e=>{if(lookId!==null)return;e.preventDefault();lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(lookId!==e.pointerId)return;e.preventDefault();const dx=Math.max(-65,Math.min(65,e.clientX-lastX)),dy=Math.max(-65,Math.min(65,e.clientY-lastY));yaw-=dx*sensitivity;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*sensitivity));lastX=e.clientX;lastY=e.clientY});
function releaseLook(e){if(e.pointerId===lookId)lookId=null}
renderer.domElement.addEventListener('pointerup',releaseLook);renderer.domElement.addEventListener('pointercancel',releaseLook);renderer.domElement.addEventListener('lostpointercapture',releaseLook);
let prev=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.045,(now-prev)/1000);prev=now;const f=(keys.has('w')||keys.has('z')?1:0)-(keys.has('s')?1:0)-jy,side=(keys.has('d')?1:0)-(keys.has('a')||keys.has('q')?1:0)+jx;let magnitude=Math.max(1,Math.hypot(f,side)),speed=(keys.has('shift')?11:6)*dt;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed/magnitude,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed/magnitude;
const nextX=px+dx,nextZ=pz+dz;
if(!blocked(nextX,pz))px=nextX;
if(!blocked(px,nextZ))pz=nextZ;px=Math.max(-198,Math.min(198,px));pz=Math.max(-198,Math.min(198,pz));camera.position.set(px,h(px,pz)+1.7,pz);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}requestAnimationFrame(loop);document.querySelector('#loading').classList.add('hide');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
