<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0502;color:#f4ddb0;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.home:before{content:"";position:absolute;inset:0;background:linear-gradient(#05020038,#08030110 55%,#05020055),radial-gradient(circle at 50% 40%,transparent 18%,#0007 100%)}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(15px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:5;right:14px;top:max(15px,env(safe-area-inset-top));width:45px;height:45px;border-radius:50%;border:2px solid #c49a5d;background:#15100ddf;color:#f6d995;font-size:21px;box-shadow:0 3px 13px #000c,inset 0 0 0 3px #5b4128}.hero{margin-top:clamp(54px,8vh,82px);width:min(96vw,470px);display:flex;flex-direction:column;align-items:center}.emblem{position:relative;width:180px;height:130px;margin-bottom:-55px;z-index:1}.wheel{position:absolute;left:50%;top:0;transform:translateX(-50%);width:120px;height:120px;border:9px ridge #ad7136;border-radius:50%;background:radial-gradient(circle,#332014 0 48%,#160b06 49%);box-shadow:0 5px 15px #000}.wheel:before{content:"✦";position:absolute;inset:15px;border:3px solid #79502e;border-radius:50%;display:grid;place-items:center;color:#b9874d;font-size:28px}.anchor{position:absolute;z-index:3;left:50%;top:2px;transform:translateX(-50%);font-size:88px;line-height:1;color:#e6bd78;text-shadow:0 2px #fff3c080,0 5px 4px #321707;filter:drop-shadow(0 2px 2px #000)}.banner{position:relative;z-index:2;width:100%;min-height:112px;display:flex;align-items:center;justify-content:center;padding:8px 17px;background:linear-gradient(180deg,#173047f5,#0d2238fa 55%,#081729fa);border-top:3px solid #a7763d;border-bottom:3px solid #6f4724;clip-path:polygon(5% 7%,14% 0,24% 5%,35% 0,50% 5%,65% 0,77% 5%,88% 0,96% 8%,100% 22%,97% 45%,100% 69%,95% 92%,84% 87%,73% 96%,61% 90%,50% 98%,38% 91%,26% 97%,15% 89%,5% 94%,0 77%,3% 53%,0 29%);box-shadow:0 10px 20px #000c,inset 0 0 25px #0009}.banner:before,.banner:after{content:"";position:absolute;top:8px;bottom:8px;width:4px;background:#bd8444;opacity:.55}.banner:before{left:10px}.banner:after{right:10px}h1{margin:0;font-size:clamp(59px,18vw,91px);line-height:.9;letter-spacing:-3px;background:linear-gradient(180deg,#fffdf2 0%,#fff1b8 18%,#ffd45e 45%,#f4a827 68%,#fff0a5 83%,#bd711d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.3px #4c2608;filter:drop-shadow(0 2px 0 #fff0a055) drop-shadow(0 5px 0 #5b2a09) drop-shadow(0 9px 8px #000)}.compass{position:relative;z-index:3;margin-top:-10px;width:39px;height:39px;border:2px solid #d5a65d;border-radius:50%;display:grid;place-items:center;background:#17263be8;color:#f1c36f;font-size:23px;box-shadow:0 3px 8px #000}.tagline{margin-top:7px;font-size:clamp(7px,2.2vw,10px);font-weight:700;letter-spacing:1.4px;color:#edc47d}.menu{width:min(68vw,280px);display:grid;gap:10px;margin-top:clamp(23px,4vh,38px)}.btn{position:relative;min-height:46px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fae7c0;font-size:clamp(13px,3.5vw,15px);font-weight:700;border:1px solid #bd8444;background:linear-gradient(#4d2c19f4,#28150bf8);box-shadow:0 5px 12px #000c,inset 0 0 0 3px #160b06,inset 0 0 0 4px #87592e;clip-path:polygon(6% 0,94% 0,100% 24%,100% 76%,94% 100%,6% 100%,0 76%,0 24%)}.btn:before,.btn:after{content:"◆";position:absolute;color:#d29a51;font-size:7px}.btn:before{left:9px}.btn:after{right:9px}.btn:active{transform:translateY(2px);filter:brightness(1.2)}.ico{font-size:18px;color:#e5b66e}.studio{margin-top:auto;padding-top:18px;font-size:10px;letter-spacing:2px;color:#e6c590;text-transform:uppercase}.studio strong{display:block;margin-top:3px;font-size:17px;letter-spacing:5px;color:#fff0c3;text-shadow:0 2px 5px #000}@media(max-height:700px){.hero{margin-top:40px;transform:scale(.9);transform-origin:top center;margin-bottom:-25px}.menu{margin-top:15px;gap:7px}.btn{min-height:42px}.studio{padding-top:8px}}@media(min-width:700px){.hero{margin-top:60px}.menu{width:290px}}</style></head><body><main class="home"><div class="ui"><button class="music" id="music" aria-label="Musique">♪</button><header class="hero"><div class="emblem"><div class="wheel"></div><div class="anchor">⚓</div></div><div class="banner"><h1>SURVIVAL</h1></div><div class="compass">✥</div><div class="tagline">EXPLORER · SURVIVRE · CONSTRUIRE · ÉVOLUER</div></header><nav class="menu"><a class="btn" href="login.html"><span class="ico">♙</span>Se connecter</a><a class="btn" href="login.html?mode=register"><span class="ico">♙＋</span>S'inscrire</a><a class="btn" href="world.html"><span class="ico">✥</span>Découvrir le jeu</a></nav><footer class="studio">ÉDITÉ PAR LE STUDIO<strong>NINI</strong></footer></div></main><script>const b=document.getElementById('music');let a=null,on=false;b.onclick=async()=>{if(!a){a=new Audio('tavern-theme.mp3');a.loop=true;a.volume=.32}try{if(on){a.pause();on=false;b.textContent='♪'}else{await a.play();on=true;b.textContent='♫'}}catch(e){on=false;b.textContent='♪'}};</script></body></html>
