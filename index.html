<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.home:before{content:"";position:absolute;inset:0;background:linear-gradient(#05020022,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0005 100%)}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:10;right:14px;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:linear-gradient(#183653,#071a2b);color:#ffd67b;font-size:22px;box-shadow:0 3px 13px #000d,inset 0 0 0 3px #7b522a}.hero{margin-top:clamp(55px,8vh,90px);width:min(100vw,520px);display:flex;justify-content:center}.title-logo{display:block;width:min(96vw,500px);height:auto;max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(69vw,285px);display:grid;gap:10px;margin-top:clamp(15px,2.5vh,28px)}.btn{position:relative;min-height:48px;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:#fff0c7;font-size:clamp(13px,3.5vw,15px);font-weight:700;letter-spacing:.3px;border:2px solid #c58a3d;background:linear-gradient(180deg,#173a59 0%,#0d2a45 48%,#071b30 100%);box-shadow:0 6px 13px #000d,inset 0 1px 0 #fff3b03d,inset 0 0 0 2px #050d15,inset 0 0 0 4px #8c5c2c;clip-path:polygon(6% 0,94% 0,100% 24%,100% 76%,94% 100%,6% 100%,0 76%,0 24%)}.btn:before,.btn:after{content:"◆";position:absolute;color:#f0b64f;font-size:8px;text-shadow:0 0 5px #f3a51d}.btn:before{left:9px}.btn:after{right:9px}.btn:hover{background:linear-gradient(180deg,#215077,#103651,#092239)}.btn:active{transform:translateY(2px);filter:brightness(1.22)}.ico{font-size:19px;color:#ffd06b;text-shadow:0 0 5px #9c5d13}.studio{margin-top:auto;padding-top:12px;color:#e9c78c;text-transform:uppercase;font-size:9px;letter-spacing:2.5px}.studio strong{display:block;margin-top:2px;font-size:20px;line-height:1.05;letter-spacing:5px;background:linear-gradient(#fff1c4,#d99a43);-webkit-background-clip:text;background-clip:text;color:transparent}.studio span{display:block;font-size:9px;letter-spacing:4px;margin-top:2px}@media(max-height:700px){.hero{margin-top:38px}.title-logo{max-height:32vh}.menu{margin-top:5px;gap:7px}.btn{min-height:42px}.studio{padding-top:5px}}@media(min-width:700px){.hero{margin-top:55px}.title-logo{width:510px}.menu{width:300px}}</style></head><body><main class="home"><div class="ui"><button class="music" id="music" aria-label="Musique">♪</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" href="login.html"><span class="ico">♙</span>Se connecter</a><a class="btn" href="login.html?mode=register"><span class="ico">♙＋</span>S'inscrire</a><a class="btn" href="world.html"><span class="ico">✥</span>Découvrir le jeu</a></nav><footer class="studio">ÉDITÉ PAR LE STUDIO<strong>NINI</strong><span>CORPORATION</span></footer></div></main><script>const b=document.getElementById('music');let a=null,on=false;b.onclick=async()=>{if(!a){a=new Audio('tavern-theme.mp3');a.loop=true;a.volume=.32}try{if(on){a.pause();on=false;b.textContent='♪'}else{await a.play();on=true;b.textContent='♫'}}catch(e){on=false;b.textContent='♪'}};</script></body></html>
