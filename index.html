 shrubDummy.updateMatrix();shrubGroups[k].setMatrixAt(index,shrubDummy.matrix);shrubFilled[k]++;
}
for(let k=0;k<4;k++){const group=shrubGroups[k];group.count=shrubFilled[k];group.instanceMatrix.needsUpdate=true;group.frustumCulled=false;scene.add(group);}
for(let i=0;i<grassCount;i++){
 const x=(rand()-.5)*355,z=(rand()-.5)*355,scale=.38+rand()*.67;
 const localBiome=biomeAt(x,z,h(x,z));
 if(localBiome===4||localBiome===2)continue; // snow and exposed rock
 const palette=localBiome===3?2:(localBiome===5||localBiome===6?1:0);
 if(localBiome===3&&rand()<.9)continue; // sparse desert clumps
 const patch=.5+.5*Math.sin(x*.13+Math.cos(z*.07))*Math.cos(z*.12);
 const density=localBiome===5?.94:localBiome===6?.8:localBiome===1?.96:.89;
 if(rand()>density*(.55+.45*patch))continue;
 const target=grasses[palette],idx=grassFilled[palette]++;
 matrixDummy.position.set(x,h(x,z)-.025,z);
 matrixDummy.rotation.set(0,rand()*Math.PI*2,0);
 matrixDummy.scale.set(scale,scale*(.7+rand()*.7),scale);
 matrixDummy.updateMatrix();target.setMatrixAt(idx,matrixDummy.matrix);
}
for(let k=0;k<grasses.length;k++){
 grasses[k].count=grassFilled[k];grasses[k].instanceMatrix.needsUpdate=true;scene.add(grasses[k]);
}

// V12: instanced, varied trees to reduce Android draw calls.
const treeTrunk = new THREE.CylinderGeometry(.17,.54,1,7,3);
const treeBranch = new THREE.CylinderGeometry(.045,.14,1,5);
const crownShape = new THREE.IcosahedronGeometry(1,2);
const treeBarkMat = bark;
const crownMats = [0x2d5636,0x426b40,0x557347,0x365c41].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:false}));
const trunks=new THREE.InstancedMesh(treeTrunk,treeBarkMat,220);
const branches=new THREE.InstancedMesh(treeBranch,treeBarkMat,1800);
const crowns=crownMats.map(m=>new THREE.InstancedMesh(crownShape,m,700));
const coniferMat=new THREE.MeshStandardMaterial({color:0x345740,roughness:1,flatShading:false,side:THREE.DoubleSide});
const coniferLayers=new THREE.InstancedMesh(new THREE.ConeGeometry(1,1,9),coniferMat,750);
let nt=0,nb=0,nf=0;const nc=[0,0,0,0];
function instanced(target,index,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0){
 matrixDummy.position.set(x,y,z);matrixDummy.rotation.set(rx,ry,rz);matrixDummy.scale.set(sx,sy,sz);matrixDummy.updateMatrix();target.setMatrixAt(index,matrixDummy.matrix);
}
function addTree(x,z,scale,conifer){
 const y=h(x,z);const height=(conifer?8.3:7.4)*scale;
 instanced(trunks,nt++,x,y+height*.5,z,scale,height,scale,0,rand()*6.28);
 addBlocker(x,z,.45*scale);
 if(conifer){
  for(let j=0;j<5;j++){
   const spread=(2.4-j*.36)*scale,layerHeight=(2.35-j*.21)*scale;
   instanced(coniferLayers,nf++,x,y+(2.3+j*1.25)*scale,z,spread,layerHeight,spread,0,rand()*6.28);
  }
 }else{
  const count=8+Math.floor(rand()*5);
  for(let j=0;j<count;j++){
   const angle=rand()*Math.PI*2,reach=(1.1+rand()*2.35)*scale,lev=(4.1+rand()*3.1)*scale;
   const tx=x+Math.cos(angle)*reach,tz=z+Math.sin(angle)*reach;
   const radius=(.73+rand()*.6)*scale,material=Math.floor(rand()*crownMats.length);
   instanced(crowns[material],nc[material]++,tx,y+lev,tz,radius, (.65+rand()*.5)*scale,radius);
   const dx=tx-x,dz=tz-z,dy=lev-height*.65,len=Math.hypot(dx,dy,dz);
   const branchDirection=new THREE.Vector3(dx,dy,dz).normalize();
   const quaternion=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),branchDirection);
   matrixDummy.position.set(x+dx*.48,y+height*.65+dy*.48,z+dz*.48);
   matrixDummy.quaternion.copy(quaternion);matrixDummy.scale.set(scale,len,scale);matrixDummy.updateMatrix();
   branches.setMatrixAt(nb++,matrixDummy.matrix);
   matrixDummy.quaternion.identity();
  }
 }
}
// Guaranteed surrounding woodland, leaving a clear 5m spawn area.
for(let i=0;i<28;i++){
 const angle=(i/28)*Math.PI*2+(rand()-.5)*.14;
 const distance=11+rand()*23;
 addTree(Math.cos(angle)*distance,7+Math.sin(angle)*distance,.78+rand()*.65,rand()<.42);
}
for(let i=0;i<125;i++){
 const x=(rand()-.5)*370,z=(rand()-.5)*370;
 if(Math.hypot(x,z-7)<8)continue;
 addTree(x,z,.7+rand()*1.25,rand()<.43);
}
for(const [m,count] of [[trunks,nt],[branches,nb],[coniferLayers,nf],...crowns.map((m,i)=>[m,nc[i]])]){
 m.count=count;m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;scene.add(m);
}
const rocks=Array.from({length:6},(_,i)=>irregularRock(i));for(let i=0;i<270;i++){let x=(rand()-.5)*400,z=(rand()-.5)*400; if(Math.hypot(x,z)<9)continue;let size=.22+rand()*1.65,variant=i%6;let o=mesh(rocks[variant],rockMaterials[i%4],x,h(x,z)+size*.12,z);o.scale.set(size*(.85+rand()*.55),size,size*(.8+rand()*.48));o.rotation.set((rand()-.5)*.17,rand()*Math.PI*2,(rand()-.5)*.17);addBlocker(x,z,size*1.35);}
// Procedural scattered stones and woodland debris.
const pebbleMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),rockMaterials[0],650);
for(let i=0;i<650;i++){
 const x=(rand()-.5)*350,z=(rand()-.5)*350,k=.035+rand()*.14;
 matrixDummy.position.set(x,h(x,z)+k*.28,z);
 matrixDummy.rotation.set(rand()*2,rand()*6,rand());
 matrixDummy.scale.set(k*1.8,k*.55,k*1.4);matrixDummy.updateMatrix();
 pebbleMesh.setMatrixAt(i,matrixDummy.matrix);
}
pebbleMesh.instanceMatrix.needsUpdate=true;pebbleMesh.frustumCulled=false;scene.add(pebbleMesh);
// Low-cost procedural warm forest floor details, batched as instanced meshes.
const fallenLogMat=new THREE.MeshStandardMaterial({map:organicTexture('bark'),roughness:1});
const deadwood=new THREE.InstancedMesh(new THREE.CylinderGeometry(.075,.11,1.8,6),fallenLogMat,85);
for(let i=0;i<85;i++){const x=(rand()-.5)*345,z=(rand()-.5)*345,angle=rand()*6.28;
 matrixDummy.position.set(x,h(x,z)+.12,z);matrixDummy.rotation.set(Math.PI/2,angle,0);
 matrixDummy.scale.set(.7+rand(),.7+rand()*1.4,.7+rand());
 matrixDummy.updateMatrix();deadwood.setMatrixAt(i,matrixDummy.matrix);
}deadwood.instanceMatrix.needsUpdate=true;deadwood.frustumCulled=false;scene.add(deadwood);

import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
const fernAsset='https://www.innerscene.com/api/library/fern-clumps-82a87bea/download';
new GLTFLoader().load(fernAsset,({scene:plant})=>{
  let total=0;
  for(let i=0;i<12;i++){
    const x=(rand()-.5)*65,z=(rand()-.5)*65;
    if(blocked(x,z))continue;
    const clone=plant.clone(true);
    clone.scale.setScalar(.28+rand()*.3);
    clone.position.set(x,h(x,z),z);
    clone.rotation.y=rand()*Math.PI*2;
    clone.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;}});
    scene.add(clone);total++;
  }
  console.info('Everwild V10: '+total+' fern models loaded');
},undefined,e=>console.warn('GLB unavailable; procedural fallback preserved',e));

function stick(e){const b=joystick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),amount=Math.min(l,38);jx=dx/l*amount/38;jy=dy/l*amount/38;thumb.style.transform=`translate(${jx*38}px,${jy*38}px)`}
