<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini & Pepita Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.live-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}.shade{position:absolute;z-index:.5;inset:0;background:linear-gradient(#05020022,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0005 100%);pointer-events:none}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:10;right:14px;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:radial-gradient(circle,#173b58 0 48%,#071827 52%);color:#ffd67b;font-size:22px;box-shadow:0 3px 13px #000d,inset 0 0 0 2px #6d431e,inset 0 0 0 4px #d39a42;cursor:pointer}.music.off{opacity:.65;filter:grayscale(.35)}.hero{margin-top:clamp(55px,8vh,90px);width:min(100vw,520px);display:flex;justify-content:center}.title-logo{display:block;width:min(96vw,500px);height:auto;max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(74vw,305px);display:grid;gap:11px;margin-top:clamp(14px,2.4vh,26px)}.btn{position:relative;min-height:52px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#f8d98b;font-size:clamp(13px,3.55vw,15px);font-weight:700;letter-spacing:.7px;border:1px solid #c99445;border-radius:5px;background:linear-gradient(180deg,#152f43 0%,#0b2234 46%,#071725 100%);box-shadow:0 7px 12px #000b,inset 0 1px 0 #ffe7a544,inset 0 -2px 4px #0009,0 0 0 2px #2c180d,0 0 0 3px #8c602d;transition:transform .12s ease,filter .12s ease}.btn:before,.btn:after{content:"◆";position:absolute;top:50%;transform:translateY(-50%) rotate(45deg);width:8px;height:8px;font-size:0;background:linear-gradient(135deg,#f2c36b,#81501f);border:1px solid #e3b45e;box-shadow:0 0 0 2px #29170b,0 1px 4px #000}.btn:before{left:11px}.btn:after{right:11px}.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(2px);filter:brightness(1.22)}.studio{margin-top:auto;width:min(40vw,155px);height:105px;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}.studio-logo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 8px #000e)}@media(max-height:700px){.hero{margin-top:38px}.title-logo{max-height:32vh}.menu{margin-top:4px;gap:8px}.btn{min-height:45px}.studio{width:min(34vw,130px);height:78px}}@media(min-width:700px){.hero{margin-top:55px}.title-logo{width:510px}.menu{width:305px}}@media(prefers-reduced-motion:reduce){.live-bg{display:none}}</style></head><body><main class="home"><video class="live-bg" autoplay muted loop playsinline preload="auto" poster="tavern-bg.png" aria-hidden="true"><source src="tavern-live.mp4" type="video/mp4"></video><div class="shade"></div><div class="ui"><button class="music" id="music" aria-label="Couper la musique" title="Musique">♫</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" href="login.html">Se connecter</a><a class="btn" href="login.html?mode=register">S'inscrire</a><a class="btn" href="world.html">Découvrir le jeu</a></nav><footer class="studio"><img class="studio-logo" src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></div></main><audio id="theme" src="tavern-theme.mp3" loop preload="auto"></audio><script>const v=document.querySelector('.live-bg');v.play().catch(()=>{});const a=document.getElementById('theme'),b=document.getElementById('music');a.volume=.32;let on=false;function state(x){on=x;b.textContent=x?'♫':'♪';b.classList.toggle('off',!x);b.setAttribute('aria-label',x?'Couper la musique':'Lancer la musique')}async function start(){try{await a.play();state(true)}catch(e){state(false)}}start();const unlock=()=>{if(!on&&a.paused)start();document.removeEventListener('pointerdown',unlock)};document.addEventListener('pointerdown',unlock,{once:true});b.onclick=async e=>{e.stopPropagation();if(on){a.pause();state(false)}else{await start()}};</script></body></html>
