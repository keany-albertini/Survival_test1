<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini & Pepita Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.live-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}.shade{position:absolute;z-index:.5;inset:0;background:linear-gradient(#05020022,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0005 100%);pointer-events:none}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:10;right:14px;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:radial-gradient(circle,#173b58 0 48%,#071827 52%);color:#ffd67b;font-size:22px;box-shadow:0 3px 13px #000d,inset 0 0 0 2px #6d431e,inset 0 0 0 4px #d39a42;cursor:pointer}.music.off{opacity:.65;filter:grayscale(.35)}.hero{margin-top:clamp(55px,8vh,90px);width:min(100vw,520px);display:flex;justify-content:center}.title-logo{display:block;width:min(96vw,500px);height:auto;max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(76vw,310px);display:grid;gap:12px;margin-top:clamp(14px,2.4vh,26px);perspective:600px}.btn{position:relative;isolation:isolate;min-height:54px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-transform:uppercase;color:#ffe9a9;font-size:clamp(12px,3.5vw,15px);font-weight:800;letter-spacing:1.15px;border:0;background:linear-gradient(180deg,#143954 0%,#0b2941 48%,#06192a 100%);box-shadow:0 7px 14px #000d,inset 0 1px 0 #fff1b846,inset 0 -4px 7px #020b13cc;clip-path:polygon(8% 0,92% 0,96% 12%,100% 12%,100% 88%,96% 88%,92% 100%,8% 100%,4% 88%,0 88%,0 12%,4% 12%);transition:transform .12s ease,filter .12s ease}.btn:before{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(90deg,#70451d,#e0aa51 10%,#8b5826 18%,#d8a04a 50%,#8b5826 82%,#e0aa51 90%,#70451d);clip-path:inherit}.btn:after{content:"";position:absolute;z-index:-1;inset:3px;background:linear-gradient(180deg,#153d5b,#0b2b45 50%,#061a2c);clip-path:polygon(7% 0,93% 0,97% 12%,100% 12%,100% 88%,97% 88%,93% 100%,7% 100%,3% 88%,0 88%,0 12%,3% 12%);box-shadow:inset 0 0 0 1px #f0bd6660}.btn .ico{width:25px;height:25px;display:grid;place-items:center;color:#ffe08a;font-size:17px;border:1px solid #b87c32;border-radius:50%;background:radial-gradient(circle,#23465d,#071827 70%);box-shadow:0 0 0 2px #38220f,0 0 7px #e3a43b55;text-shadow:0 1px 3px #000}.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}.btn:active{transform:translateY(2px) scale(.985);filter:brightness(1.25)}.studio{margin-top:auto;width:min(40vw,155px);height:105px;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}.studio-logo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 8px #000e)}@media(max-height:700px){.hero{margin-top:38px}.title-logo{max-height:32vh}.menu{margin-top:4px;gap:8px}.btn{min-height:46px}.studio{width:min(34vw,130px);height:78px}}@media(min-width:700px){.hero{margin-top:55px}.title-logo{width:510px}.menu{width:310px}}@media(prefers-reduced-motion:reduce){.live-bg{display:none}}</style></head><body><main class="home"><video class="live-bg" autoplay muted loop playsinline preload="auto" poster="tavern-bg.png" aria-hidden="true"><source src="tavern-live.mp4" type="video/mp4"></video><div class="shade"></div><div class="ui"><button class="music" id="music" aria-label="Couper la musique" title="Musique">♫</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" href="login.html"><span class="ico">♙</span>Se connecter</a><a class="btn" href="login.html?mode=register"><span class="ico">♙＋</span>S'inscrire</a><a class="btn" href="world.html"><span class="ico">✥</span>Découvrir le jeu</a></nav><footer class="studio"><img class="studio-logo" src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></div></main><audio id="theme" src="tavern-theme.mp3" loop preload="auto"></audio><script>const v=document.querySelector('.live-bg');v.play().catch(()=>{});const a=document.getElementById('theme'),b=document.getElementById('music');a.volume=.32;let on=false;function state(x){on=x;b.textContent=x?'♫':'♪';b.classList.toggle('off',!x);b.setAttribute('aria-label',x?'Couper la musique':'Lancer la musique')}async function start(){try{await a.play();state(true)}catch(e){state(false)}}start();const unlock=()=>{if(!on&&a.paused)start();document.removeEventListener('pointerdown',unlock)};document.addEventListener('pointerdown',unlock,{once:true});b.onclick=async e=>{e.stopPropagation();if(on){a.pause();state(false)}else{await start()}};</script></body></html>
