<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Everwild | Aperçu 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#14212b;color:#eee;font-family:system-ui,sans-serif}canvas{display:block}#hud{position:absolute;left:14px;top:14px;padding:13px 16px;background:#06131ac9;border:1px solid #ffffff32;border-radius:10px;max-width:min(420px,92vw);pointer-events:none}h1{font-size:22px;letter-spacing:5px;margin:0 0 7px}small{opacity:.83;line-height:1.5;display:block}#badge{color:#dfc49b;font-size:11px;letter-spacing:2px;text-transform:uppercase}#stick{position:absolute;left:26px;bottom:30px;width:108px;height:108px;border-radius:60px;border:2px solid #fff7;background:#ffffff18;touch-action:none}#thumb{position:absolute;left:34px;top:34px;width:36px;height:36px;border-radius:50%;background:#ffffff8a}#hint{position:absolute;right:20px;bottom:31px;background:#06131ab0;padding:12px;border-radius:8px;font-size:12px;max-width:170px;pointer-events:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#182a31;z-index:5}#loading.hide{display:none}@media(min-width:800px){#stick{display:none}}</style></head>
<body><div id="loading">Chargement de l'environnement 3D…</div><div id="hud"><div id="badge">Prototype visuel • non contractuel</div><h1>EVERWILD</h1><small>Forêt des Premiers Âges · Aperçu navigable</small><small>Vie 100 · Faim 100 · Soif 100</small></div><div id="stick"><div id="thumb"></div></div><div id="hint">Téléphone : joystick à gauche, glisser à droite pour regarder.<br>PC : ZQSD/WASD et souris.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9eb5bf);scene.fog=new THREE.FogExp2(0x93a5a5,.009);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc7dcea,0x54543c,2.0));const sun=new THREE.DirectionalLight(0xffe2ae,3.1);sun.position.set(-80,110,-70);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-115;sun.shadow.camera.right=115;sun.shadow.camera.top=115;sun.shadow.camera.bottom=-115;scene.add(sun);
const green=new THREE.MeshStandardMaterial({color:0x526849,roughness:1}),earth=new THREE.MeshStandardMaterial({color:0x6d6655,roughness:1}),rock=new THREE.MeshStandardMaterial({color:0x747976,roughness:.95,flatShading:true}),bark=new THREE.MeshStandardMaterial({color:0x594336,roughness:1}),leaf=[0x294e37,0x365b40,0x497047].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true}));const moss=new THREE.MeshStandardMaterial({color:0x748251,roughness:1});
const h=(x,z)=>Math.sin(x*.038)*Math.cos(z*.045)*5+Math.sin(x*.09+z*.063)*1.1+Math.cos(z*.012+x*.014)*3;
const grid=140, step=3;const verts=[],cols=[],indices=[];const c=new THREE.Color();for(let z=0;z<=grid;z++)for(let x=0;x<=grid;x++){let px=(x-grid/2)*step,pz=(z-grid/2)*step,y=h(px,pz);verts.push(px,y,pz);let v=Math.max(0,Math.min(1,(y+5)/21));c.setRGB(.16+v*.18,.24+v*.15,.13+v*.12);cols.push(c.r,c.g,c.b)}for(let z=0;z<grid;z++)for(let x=0;x<grid;x++){let a=z*(grid+1)+x,b=a+1,d=a+grid+1;indices.push(a,d,b,b,d,d+1)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.setIndex(indices);geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1});const terrain=new THREE.Mesh(geo,mat);terrain.receiveShadow=true;scene.add(terrain);
let seed=18299;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function mesh(geom,material,x,y,z){const m=new THREE.Mesh(geom,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
const trunkGeo=new THREE.CylinderGeometry(.2,.5,6,7),cones=[new THREE.ConeGeometry(3,5,7),new THREE.ConeGeometry(2.6,4.7,7),new THREE.ConeGeometry(2,4.3,7)];
for(let i=0;i<265;i++){let x=(rand()-.5)*390,z=(rand()-.5)*390;if(Math.hypot(x,z)<18)continue;let y=h(x,z),s=.7+rand()*1.45;const trunk=mesh(trunkGeo,bark,x,y+3*s,z);trunk.scale.set(s,s,s);for(let j=0;j<3;j++){let canopy=mesh(cones[j],leaf[Math.floor(rand()*leaf.length)],x,y+(5.6+j*2.15)*s,z);canopy.scale.set(s,s,s)}}
const rocks=[new THREE.DodecahedronGeometry(1,1),new THREE.IcosahedronGeometry(1,0)];for(let i=0;i<340;i++){let x=(rand()-.5)*400,z=(rand()-.5)*400; if(Math.hypot(x,z)<9)continue;let s=.2+rand()*1.9;let o=mesh(rocks[i%2],rock,x,h(x,z)+s*.35,z);o.scale.set(s*1.4,s*.8,s);o.rotation.set(rand()*2,rand()*6,rand());}
for(let i=0;i<900;i++){let x=(rand()-.5)*350,z=(rand()-.5)*350,s=.15+rand()*.45;const tuft=mesh(new THREE.ConeGeometry(s,s*2,3),moss,x,h(x,z)+s*.7,z);tuft.rotation.z=(rand()-.5)*.8;tuft.castShadow=false;}
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let yaw=.5,pitch=-.09,px=0,pz=7,lastX=0,lastY=0,looking=false,jx=0,jy=0;const joystick=document.querySelector('#stick'),thumb=document.querySelector('#thumb');function stick(e){const b=joystick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),amount=Math.min(l,38);jx=dx/l*amount/38;jy=dy/l*amount/38;thumb.style.transform=`translate(${jx*38}px,${jy*38}px)`}joystick.addEventListener('pointerdown',e=>{joystick.setPointerCapture(e.pointerId);stick(e)});joystick.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)stick(e)});const reset=()=>{jx=jy=0;thumb.style.transform=''};joystick.addEventListener('pointerup',reset);joystick.addEventListener('pointercancel',reset);
renderer.domElement.addEventListener('pointerdown',e=>{looking=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!looking)return;yaw-=(e.clientX-lastX)*.0035;pitch=Math.max(-1.1,Math.min(.75,pitch-(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>looking=false);
let prev=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.045,(now-prev)/1000);prev=now;const f=(keys.has('w')||keys.has('z')?1:0)-(keys.has('s')?1:0)-jy,side=(keys.has('d')?1:0)-(keys.has('a')||keys.has('q')?1:0)+jx;let magnitude=Math.max(1,Math.hypot(f,side)),speed=(keys.has('shift')?11:6)*dt;px+=(Math.sin(yaw)*f+Math.cos(yaw)*side)*speed/magnitude;pz+=(-Math.cos(yaw)*f+Math.sin(yaw)*side)*speed/magnitude;px=Math.max(-198,Math.min(198,px));pz=Math.max(-198,Math.min(198,pz));camera.position.set(px,h(px,pz)+1.7,pz);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}requestAnimationFrame(loop);document.querySelector('#loading').classList.add('hide');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
