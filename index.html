<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.home:before{content:"";position:absolute;inset:0;background:linear-gradient(#05020025,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0006 100%)}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:10;right:14px;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d09a4e;background:#15100de8;color:#ffd988;font-size:22px;box-shadow:0 3px 13px #000d,inset 0 0 0 3px #5b4128}.hero{margin-top:clamp(42px,6.5vh,65px);width:min(98vw,500px);display:flex;flex-direction:column;align-items:center}.crest{position:relative;width:220px;height:162px;margin-bottom:-72px;z-index:1}.wheel{position:absolute;left:50%;top:0;transform:translateX(-50%);width:145px;height:145px;border:10px ridge #a96c32;border-radius:50%;background:repeating-conic-gradient(#70421f 0 8deg,#26150b 8deg 45deg);box-shadow:0 6px 18px #000}.wheel:before{content:"";position:absolute;inset:16px;border:5px double #b97d3e;border-radius:50%;background:radial-gradient(circle,#352014 0 30%,transparent 31%)}.wheel:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#d2a15e;font-size:32px}.anchor{position:absolute;z-index:3;left:50%;top:8px;transform:translateX(-50%);font-size:103px;line-height:1;color:#f2d29c;text-shadow:0 2px #fff9dd,0 5px 3px #6b3d18,0 8px 9px #000;filter:drop-shadow(0 2px 1px #000)}.rope{position:absolute;z-index:4;left:50%;top:25px;width:62px;height:91px;transform:translateX(-50%) rotate(-18deg);border:5px solid #b77a35;border-left-color:transparent;border-radius:50%;opacity:.8}.banner{position:relative;z-index:2;width:100%;min-height:125px;display:flex;align-items:center;justify-content:center;padding:8px 12px;background:linear-gradient(180deg,#163653 0%,#0b2842 48%,#071b30 100%);border-top:3px solid #bd8240;border-bottom:3px solid #805125;clip-path:polygon(3% 11%,12% 2%,22% 7%,32% 1%,43% 6%,51% 2%,62% 7%,72% 1%,83% 7%,96% 2%,100% 19%,97% 38%,100% 61%,96% 91%,85% 86%,75% 97%,63% 90%,52% 99%,40% 91%,29% 97%,18% 88%,5% 96%,0 78%,3% 57%,0 34%);box-shadow:0 12px 22px #000d,inset 0 0 35px #0009}.banner:before,.banner:after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);color:#e6ad58;font-size:18px}.banner:before{left:17px}.banner:after{right:17px}h1{margin:0;font-size:clamp(64px,19vw,98px);line-height:.88;letter-spacing:-4px;background:linear-gradient(180deg,#fffdf1 0%,#fff0ae 16%,#ffd66b 37%,#f5aa2f 59%,#fff0a5 78%,#b96714 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #522a0a;filter:drop-shadow(0 2px 0 #fff4b070) drop-shadow(0 5px 0 #6c350d) drop-shadow(0 9px 8px #000)}.compass{position:relative;z-index:4;margin-top:-15px;width:48px;height:48px;border:2px solid #e0ac5d;border-radius:50%;display:grid;place-items:center;background:#0d2940;color:#ffd77c;font-size:28px;box-shadow:0 4px 9px #000}.menu{width:min(69vw,285px);display:grid;gap:9px;margin-top:clamp(25px,4vh,38px)}.btn{position:relative;min-height:48px;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:#f8e8c8;font-size:clamp(13px,3.5vw,15px);font-weight:700;border:1px solid #c48a48;background:linear-gradient(180deg,#17232beF,#0c171ef5);box-shadow:0 5px 12px #000c,inset 0 0 0 3px #070b0e,inset 0 0 0 4px #936332;clip-path:polygon(6% 0,94% 0,100% 24%,100% 76%,94% 100%,6% 100%,0 76%,0 24%)}.btn:before,.btn:after{content:"◆";position:absolute;color:#d7a154;font-size:8px}.btn:before{left:9px}.btn:after{right:9px}.btn:active{transform:translateY(2px);filter:brightness(1.2)}.ico{font-size:19px;color:#e9bd75}.studio{margin-top:auto;padding-top:12px;color:#e9c78c;text-transform:uppercase;font-size:9px;letter-spacing:2.5px}.studio strong{display:block;margin-top:2px;font-size:20px;line-height:1.05;letter-spacing:5px;background:linear-gradient(#fff1c4,#d99a43);-webkit-background-clip:text;background-clip:text;color:transparent}.studio span{display:block;font-size:9px;letter-spacing:4px;margin-top:2px}@media(max-height:700px){.hero{margin-top:30px;transform:scale(.86);transform-origin:top center;margin-bottom:-42px}.menu{margin-top:12px;gap:7px}.btn{min-height:42px}.studio{padding-top:6px}}@media(min-width:700px){.hero{margin-top:50px}.menu{width:300px}}</style></head><body><main class="home"><div class="ui"><button class="music" id="music" aria-label="Musique">♪</button><header class="hero"><div class="crest"><div class="wheel"></div><div class="anchor">⚓</div><div class="rope"></div></div><div class="banner"><h1>SURVIVAL</h1></div><div class="compass">✥</div></header><nav class="menu"><a class="btn" href="login.html"><span class="ico">♙</span>Se connecter</a><a class="btn" href="login.html?mode=register"><span class="ico">♙＋</span>S'inscrire</a><a class="btn" href="world.html"><span class="ico">✥</span>Découvrir le jeu</a></nav><footer class="studio">ÉDITÉ PAR LE STUDIO<strong>NINI</strong><span>CORPORATION</span></footer></div></main><script>const b=document.getElementById('music');let a=null,on=false;b.onclick=async()=>{if(!a){a=new Audio('tavern-theme.mp3');a.loop=true;a.volume=.32}try{if(on){a.pause();on=false;b.textContent='♪'}else{await a.play();on=true;b.textContent='♫'}}catch(e){on=false;b.textContent='♪'}};</script></body></html>
