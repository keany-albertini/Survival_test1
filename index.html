<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Nini & Pepita Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.live-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,transparent 18%,#0007 100%)}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:14px;text-align:center}.round{position:absolute;z-index:10;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:#0b2943;color:#ffd67b;font-size:21px}.music{left:14px}.logout{right:14px;display:none}.hero{margin-top:clamp(55px,8vh,90px)}.title-logo{width:min(96vw,500px);max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(70vw,282px);display:grid;gap:11px;margin-top:18px}.btn{min-height:55px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-transform:uppercase;color:#e8c987;font-weight:800;border:2px solid #79633c;background:linear-gradient(#55564e,#1a1b18);box-shadow:0 8px 14px #000c}.studio-mark{position:fixed;z-index:8;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:clamp(70px,19vw,112px);height:68px;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}.studio-mark img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #000e);opacity:.92}</style></head><body><main class="home"><video class="live-bg" autoplay muted loop playsinline poster="tavern-bg.png"><source src="tavern-live.mp4" type="video/mp4"></video><div class="shade"></div><div class="ui"><button class="round music" id="music">♫</button><button class="round logout" id="logout" title="Déconnexion">↪</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" href="servers.html">▶ Jouer</a><a class="btn authBtn" href="login.html">♟ Connexion</a><a class="btn authBtn" href="login.html?mode=register">♟＋ Inscription</a></nav></div><footer class="studio-mark"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></main><audio id="theme" src="tavern-theme.mp3" loop></audio><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const a=document.getElementById('theme'),b=document.getElementById('music');a.volume=.32;let on=false;async function start(){try{await a.play();on=true;b.textContent='♫'}catch(e){b.textContent='♪'}}start();b.onclick=()=>{if(on){a.pause();on=false;b.textContent='♪'}else start()};const out=document.getElementById('logout'),authBtns=document.querySelectorAll('.authBtn');async function syncAuth(){const {data:{session}}=await sb.auth.getSession();authBtns.forEach(x=>x.style.display=session?'none':'flex');out.style.display=session?'block':'none'}out.onclick=async()=>{await sb.auth.signOut();sessionStorage.removeItem('survival_character_id');sessionStorage.removeItem('survival_server_id');sessionStorage.removeItem('survival_server_name');syncAuth()};syncAuth();sb.auth.onAuthStateChange(()=>syncAuth());</script></body></html>
