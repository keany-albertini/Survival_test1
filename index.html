<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini & Pepita Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.live-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}.shade{position:absolute;z-index:.5;inset:0;background:linear-gradient(#05020022,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0005 100%);pointer-events:none}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.music{position:absolute;z-index:10;right:14px;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:radial-gradient(circle,#173b58 0 48%,#071827 52%);color:#ffd67b;font-size:22px;box-shadow:0 3px 13px #000d,inset 0 0 0 2px #6d431e,inset 0 0 0 4px #d39a42;cursor:pointer}.music.off{opacity:.65;filter:grayscale(.35)}.hero{margin-top:clamp(55px,8vh,90px);width:min(100vw,520px);display:flex;justify-content:center}.title-logo{display:block;width:min(96vw,500px);height:auto;max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(82vw,330px);display:grid;gap:12px;margin-top:clamp(12px,2.2vh,24px)}.btn{position:relative;isolation:isolate;min-height:58px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 25px;text-decoration:none;text-transform:uppercase;color:#e7c487;font-size:clamp(13px,3.7vw,16px);font-weight:800;letter-spacing:1px;border:0;border-radius:16px 12px 17px 10px;background:linear-gradient(175deg,#4a4a42 0%,#292a27 34%,#181916 73%,#34342e 100%);box-shadow:0 9px 13px #000c,inset 0 2px 2px #ffffff25,inset 0 -4px 5px #000b,0 0 0 2px #16130d,0 0 0 3px #6f5a35;clip-path:polygon(4% 7%,13% 2%,26% 5%,39% 1%,52% 4%,67% 1%,82% 5%,96% 3%,100% 18%,98% 38%,100% 57%,97% 79%,91% 96%,75% 98%,60% 95%,45% 99%,29% 96%,14% 99%,3% 92%,0 74%,2% 54%,0 34%);transition:transform .12s ease,filter .12s ease}.btn:before{content:"";position:absolute;z-index:-1;inset:4px;border:1px solid #8a7650aa;border-radius:13px;background:radial-gradient(circle at 18% 25%,#69675c22 0 2px,transparent 3px),radial-gradient(circle at 72% 70%,#0006 0 2px,transparent 3px),linear-gradient(170deg,#3c3d37,#20211e 52%,#30312b);clip-path:inherit}.btn:after{content:"";position:absolute;inset:-3px;z-index:-2;border-radius:17px;box-shadow:inset 7px 0 0 -5px #566b32,inset -8px 0 0 -6px #3e5427;pointer-events:none}.ico{font-size:20px;color:#d8b16d;text-shadow:0 2px 2px #000,0 0 5px #b9863d55;filter:drop-shadow(0 1px 1px #000)}.btn:hover{filter:brightness(1.14)}.btn:active{transform:translateY(2px) scale(.985);filter:brightness(1.2)}.studio{margin-top:auto;width:min(40vw,155px);height:105px;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}.studio-logo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 8px #000e)}@media(max-height:700px){.hero{margin-top:38px}.title-logo{max-height:32vh}.menu{margin-top:3px;gap:8px}.btn{min-height:49px}.studio{width:min(34vw,130px);height:78px}}@media(min-width:700px){.hero{margin-top:55px}.title-logo{width:510px}.menu{width:330px}}@media(prefers-reduced-motion:reduce){.live-bg{display:none}}</style></head><body><main class="home"><video class="live-bg" autoplay muted loop playsinline preload="auto" poster="tavern-bg.png" aria-hidden="true"><source src="tavern-live.mp4" type="video/mp4"></video><div class="shade"></div><div class="ui"><button class="music" id="music" aria-label="Couper la musique" title="Musique">♫</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" href="world.html"><span class="ico">▶</span>Jouer</a><a class="btn" href="login.html"><span class="ico">♟</span>Connexion</a><a class="btn" href="login.html?mode=register"><span class="ico">♟＋</span>Inscription</a></nav><footer class="studio"><img class="studio-logo" src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></div></main><audio id="theme" src="tavern-theme.mp3" loop preload="auto"></audio><script>const v=document.querySelector('.live-bg');v.play().catch(()=>{});const a=document.getElementById('theme'),b=document.getElementById('music');a.volume=.32;let on=false;function state(x){on=x;b.textContent=x?'♫':'♪';b.classList.toggle('off',!x);b.setAttribute('aria-label',x?'Couper la musique':'Lancer la musique')}async function start(){try{await a.play();state(true)}catch(e){state(false)}}start();const unlock=()=>{if(!on&&a.paused)start();document.removeEventListener('pointerdown',unlock)};document.addEventListener('pointerdown',unlock,{once:true});b.onclick=async e=>{e.stopPropagation();if(on){a.pause();state(false)}else{await start()}};</script></body></html>
