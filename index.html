<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Everwild — Module 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#131e1c;color:#e9dfcc;font:13px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:fixed;left:12px;top:12px;background:#111e1ddc;border:1px solid #a18d624f;border-radius:12px;padding:10px;pointer-events:none}#info{position:fixed;right:12px;top:12px;background:#111e1ddc;padding:10px;border-radius:9px;pointer-events:none}#hud .bar{width:110px;height:6px;background:#0008;border-radius:8px;overflow:hidden;display:inline-block;margin:0 0 0 8px}.bar i{display:block;height:100%}.line{display:flex;align-items:center;justify-content:space-between;margin:3px 0;min-width:174px}#joy{position:fixed;left:20px;bottom:25px;width:112px;height:112px;border:2px solid #ddd8b580;border-radius:100%;background:#1a2423aa;touch-action:none}#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#c8bd91a0;border:1px solid #fff6;pointer-events:none}#buttons{position:fixed;right:20px;bottom:25px;display:grid;grid-template-columns:repeat(2,60px);gap:8px}button{background:#33483dcf;color:white;border:1px solid #e3cd9670;border-radius:50%;height:56px;font-size:10px;font-weight:bold;touch-action:manipulation}#caption{position:fixed;top:68px;left:50%;transform:translateX(-50%);text-align:center;color:#fae6bb;text-shadow:0 2px 3px #000;width:65%;font-size:11px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at top,#3d5550,#111b1b 76%);z-index:5;padding:18px}#menu.hidden{display:none}#menu .panel{width:min(420px,94vw);padding:26px;text-align:center;border:1px solid #bfa16c63;border-radius:18px;background:#162321ef}h1{font:42px Georgia,serif;letter-spacing:6px;color:#e4d1a5;margin:0}p{color:#bfc4b9}#name{background:#23352f;color:#fff;border:1px solid #b5a27d65;padding:12px;border-radius:8px;width:100%;margin:12px 0}#start{border-radius:9px;width:100%;height:45px;background:#735c3d}
</style></head><body><canvas id="scene"></canvas><div id="hud"></div><div id="info"></div><div id="caption"></div><div id="joy"><div id="knob"></div></div><div id="buttons"><button id="jump">SAUT</button><button id="mine">MINER</button><button id="place">POSER</button><button id="eat">MANGER</button></div><div id="menu"><div class="panel"><h1>EVERWILD</h1><p>Les Derniers Bastions · Module 1</p><p>Survie 2D latérale · terrain destructible · endurance et faim</p><input id="name" placeholder="Nom du survivant" maxlength="20"><button id="start">COMMENCER L'AVENTURE</button></div></div>
<script>
'use strict';
const C=document.querySelector('#scene'),G=C.getContext('2d'),hud=document.querySelector('#hud'),info=document.querySelector('#info'),caption=document.querySelector('#caption');
let width=innerWidth,height=innerHeight,scale=Math.min(devicePixelRatio||1,2),time=0,last=0,playing=false,camera=0;
function fit(){width=innerWidth;height=innerHeight;scale=Math.min(devicePixelRatio||1,2);C.width=Math.round(width*scale);C.height=Math.round(height*scale);G.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',fit);fit();
const TILE=32,ROWS=24,COLS=180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hash=n=>{let v=Math.sin(n*127.17+78.12)*43758.55;return v-Math.floor(v)};
class Terrain{
 constructor(){this.tiles=Array.from({length:ROWS},()=>Array(COLS).fill(0));this.surface=[];for(let x=0;x<COLS;x++){let top=13+Math.floor(Math.sin(x*.13)*1.4+Math.sin(x*.039)*2);top=clamp(top,9,17);this.surface[x]=top;for(let y=top;y<ROWS;y++)this.tiles[y][x]=y===top?1:y<top+3?2:3}this.trees=Array.from({length:40},(_,i)=>({x:6+i*4+Math.floor(hash(i)*3),phase:hash(i+77)*6}))}
 get(x,y){if(x<0||x>=COLS||y>=ROWS)return 3;if(y<0)return 0;return this.tiles[y][x]}
 solid(x,y){return this.get(Math.floor(x/TILE),Math.floor(y/TILE))!==0}
 mine(tx,ty){if(tx<0||tx>=COLS||ty<0||ty>=ROWS||!this.get(tx,ty))return false;this.tiles[ty][tx]=0;return true}
 put(tx,ty){if(tx<0||tx>=COLS||ty<0||ty>=ROWS||this.get(tx,ty))return false;this.tiles[ty][tx]=4;return true}
 draw(ctx,camera){let from=Math.max(0,Math.floor(camera/TILE)-1),to=Math.min(COLS,Math.ceil((camera+width)/TILE)+1);for(let x=from;x<to;x++)for(let y=0;y<ROWS;y++){const type=this.tiles[y][x];if(!type)continue;const px=x*TILE-camera,py=y*TILE;ctx.fillStyle=type===1?'#4c7250':type===2?'#715b41':type===3?'#636a68':'#98764c';ctx.fillRect(px,py,TILE+1,TILE+1);ctx.fillStyle='#0002';ctx.fillRect(px+1,py+27,30,4);if(type===1){ctx.fillStyle='#8caa6c';ctx.fillRect(px,py,32,5)}else for(let k=0;k<4;k++){ctx.fillStyle=hash(x*79+y*6+k)>.5?'#ffffff18':'#00000022';ctx.fillRect(px+hash(k+x*4)*25,py+hash(k+y*7)*27,3,2)}}}
}
const terrain=new Terrain();
class Survivor{
 constructor(){this.x=5*TILE;this.y=4*TILE;this.w=20;this.h=49;this.vx=0;this.vy=0;this.grounded=false;this.dir=1;this.facing=1;this.hunger=100;this.stamina=100;this.health=100;this.wood=4;this.stone=0;this.food=3;this.anim=0;this.crouch=false;this.name='Survivant'}
 collide(x,y){return terrain.solid(x,y)||terrain.solid(x+this.w,y)||terrain.solid(x,y+this.h-1)||terrain.solid(x+this.w,y+this.h-1)}
 update(dt,axis,down){this.crouch=down;this.vx=axis*(down?92:175);if(Math.abs(axis)>.1)this.facing=Math.sign(axis);this.anim+=Math.abs(this.vx)*dt*.07;this.hunger=clamp(this.hunger-dt*.18,0,100);this.stamina=clamp(this.stamina+(Math.abs(axis)>.1?-6:12)*dt,0,100);if(this.hunger===0)this.health=clamp(this.health-dt*1.5,0,100);
 let nx=this.x+this.vx*dt,step=Math.sign(this.vx)*2;for(let i=0;i<Math.abs(this.vx*dt);i+=2){let trial=this.x+step;if(this.collide(trial,this.y)){this.vx=0;break}this.x=trial}this.x=clamp(this.x,0,COLS*TILE-this.w);
 this.vy=Math.min(850,this.vy+1200*dt);let dy=this.vy*dt,sy=Math.sign(dy)*Math.min(3,Math.abs(dy));this.grounded=false;for(let i=0;i<Math.abs(dy);i+=Math.abs(sy)){let trial=this.y+sy;if(this.collide(this.x,trial)){if(this.vy>0)this.grounded=true;this.vy=0;break}this.y=trial}
 }
 jump(){if(this.grounded&&this.stamina>=7){this.vy=-465;this.stamina-=7;this.grounded=false}}
 draw(g){const x=Math.round(this.x-camera+this.w/2),y=Math.round(this.y+this.h);g.save();g.translate(x,y);g.scale(this.facing,1);const run=Math.abs(this.vx)>5&&!this.crouch;const stride=run?Math.sin(this.anim)*10:0;const bob=run?Math.abs(Math.sin(this.anim))*2:Math.sin(time*2)*.8;g.translate(0,bob+(this.crouch?15:0));g.strokeStyle='#191b16';g.lineWidth=9;g.lineCap='round';
 // Boots and cloth layers with separate animated limbs.
 g.beginPath();g.moveTo(-6,-23);g.lineTo(-7+stride,-4);g.moveTo(7,-23);g.lineTo(6-stride,-4);g.stroke();
 g.strokeStyle='#514b3b';g.lineWidth=10;g.beginPath();g.moveTo(-6,-35);g.lineTo(-7,-20);g.moveTo(7,-35);g.lineTo(7,-20);g.stroke();
 g.fillStyle='#555a4c';g.fillRect(-13,-76,27,43);g.fillStyle='#857655';g.fillRect(-13,-47,27,5);g.fillStyle='#c3a074';g.fillRect(-2,-85,8,13);
 g.strokeStyle='#555f50';g.lineWidth=10;g.beginPath();g.moveTo(-12,-71);g.lineTo(-18-stride*.35,-45);g.moveTo(13,-72);g.lineTo(17+stride*.35,-48);g.stroke();
 g.fillStyle='#bb9170';g.beginPath();g.ellipse(1,-98,12,16,0,0,Math.PI*2);g.fill();g.fillStyle='#352a22';g.beginPath();g.ellipse(0,-108,13,8,0,Math.PI,Math.PI*2);g.fill();g.fillRect(-12,-111,24,8);g.fillStyle='#272922';g.fillRect(7,-100,2,2);g.restore()}
}
const player=new Survivor();let joystick=0,down=false,activePointer=null,keys={};
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();player.jump()}if(['arrowleft','arrowright','arrowdown'].includes(e.key.toLowerCase()))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
function stick(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(x,y)),mag=Math.min(37,d);joystick=clamp(x/39,-1,1);down=y>25;knob.style.transform='translate('+x/d*mag+'px,'+y/d*mag+'px)'}
joy.addEventListener('pointerdown',e=>{activePointer=e.pointerId;joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)stick(e)});for(const ev of ['pointerup','pointercancel'])joy.addEventListener(ev,e=>{if(activePointer===e.pointerId){activePointer=null;joystick=0;down=false;knob.style.transform='translate(0px,0px)'}});
let message='',messageTime=0;function notify(m){message=m;messageTime=2.2}
function target(){let x=Math.floor((player.x+player.w/2+player.facing*38)/TILE),y=Math.floor((player.y+player.h*.65)/TILE);return {x,y}}
document.querySelector('#jump').onclick=()=>player.jump();
document.querySelector('#mine').onclick=()=>{const t=target();let found=false;for(let j=0;j<3;j++){let ty=t.y+j;if(terrain.mine(t.x,ty)){player.stone++;found=true;break}}notify(found?'Pierre récoltée':'Aucun bloc à portée')};
document.querySelector('#place').onclick=()=>{const t=target();if(player.wood<=0){notify('Plus de bois');return}if(terrain.put(t.x,t.y+1)){player.wood--;notify('Bloc placé')}else notify('Emplacement occupé')};
document.querySelector('#eat').onclick=()=>{if(player.food>0){player.food--;player.hunger=clamp(player.hunger+25,0,100);notify('Nourriture consommée')}else notify('Aucune nourriture')};
document.querySelector('#start').onclick=()=>{player.name=document.querySelector('#name').value.trim()||'Survivant';document.querySelector('#menu').classList.add('hidden');playing=true};
function environment(g){let sky=g.createLinearGradient(0,0,0,height);sky.addColorStop(0,'#344f61');sky.addColorStop(.65,'#87938b');sky.addColorStop(1,'#293e37');g.fillStyle=sky;g.fillRect(0,0,width,height);g.fillStyle='#d4b99a88';g.beginPath();g.arc(width*.79,height*.19,36,0,Math.PI*2);g.fill();
 for(let layer=0;layer<3;layer++){g.fillStyle=['#637d79','#4b7065','#37584d'][layer];g.beginPath();g.moveTo(0,height);for(let x=0;x<=width+10;x+=8){let sx=x+camera*(.12+layer*.16);g.lineTo(x,height*(.40+layer*.065)+Math.sin(sx*.006+layer)*28+Math.sin(sx*.012)*10)}g.lineTo(width,height);g.fill()}
 for(let i=0;i<55;i++){let x=i*125-camera*.43;x=((x%(width+180))+(width+180))%(width+180)-80;let y=height*.55+(i%4)*13;g.strokeStyle='#263f37';g.lineWidth=8;g.beginPath();g.moveTo(x,y+55);g.lineTo(x,y-35);g.stroke();g.fillStyle='#345546aa';g.beginPath();g.ellipse(x,y-44,28+hash(i)*13,38,0,0,Math.PI*2);g.fill()}}
function forest(g){for(const o of terrain.trees){let x=o.x*TILE-camera,top=terrain.surface[o.x]*TILE;if(x< -80||x>width+90)continue;g.strokeStyle='#4e3f2d';g.lineWidth=12;g.beginPath();g.moveTo(x,top);g.lineTo(x+3,top-132);g.stroke();let sway=Math.sin(time*.65+o.phase)*3;for(let j=0;j<3;j++){g.fillStyle=['#2b4a39','#3b6148','#486e4e'][j];g.beginPath();g.ellipse(x+sway+j*7-9,top-135-j*12,35,31,0,0,Math.PI*2);g.fill()}}}
function render(){environment(G);G.save();G.translate(0,Math.min(0,height-ROWS*TILE));forest(G);terrain.draw(G,camera);player.draw(G);G.restore()}
function drawHUD(){hud.innerHTML=[['Vie',player.health,'#a85d56'],['Faim',player.hunger,'#c49d57'],['Endurance',player.stamina,'#83ab7c']].map(([l,n,c])=>'<div class="line">'+l+'<span class="bar"><i style="width:'+n+'%;background:'+c+'"></i></span></div>').join('');info.textContent='🪵 '+player.wood+' · 🪨 '+player.stone+' · 🥖 '+player.food;caption.textContent=messageTime>0?message:'← → marcher · ↓ accroupir · sauter · miner · poser'}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;time+=dt;if(playing){let axis=clamp(joystick+(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a||keys.q?1:0),-1,1);player.update(dt,axis,down||keys.arrowdown||keys.s);camera=clamp(player.x-width*.35,0,COLS*TILE-width);messageTime=Math.max(0,messageTime-dt);drawHUD()}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
