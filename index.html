<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120905"><title>Survival — Nini & Pepita Corporation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080402;color:#f7dfac;font-family:Georgia,'Times New Roman',serif}.home{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover no-repeat;overflow:hidden}.live-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}.shade{position:absolute;z-index:.5;inset:0;background:linear-gradient(#05020022,#08030108 52%,#03010072),radial-gradient(circle at 50% 35%,transparent 18%,#0005 100%);pointer-events:none}.ui{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));text-shadow:0 3px 8px #000}.round{position:absolute;z-index:10;top:max(15px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:2px solid #d6a04c;background:radial-gradient(circle,#173b58 0 48%,#071827 52%);color:#ffd67b;font-size:21px;box-shadow:0 3px 13px #000d,inset 0 0 0 2px #6d431e,inset 0 0 0 4px #d39a42;cursor:pointer}.music{left:14px}.logout{right:14px;display:none;font-size:20px}.music.off{opacity:.65;filter:grayscale(.35)}.hero{margin-top:clamp(55px,8vh,90px);width:min(100vw,520px);display:flex;justify-content:center}.title-logo{display:block;width:min(96vw,500px);height:auto;max-height:36vh;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}.menu{width:min(70vw,282px);display:grid;gap:11px;margin-top:clamp(12px,2.2vh,24px)}.btn{position:relative;isolation:isolate;min-height:55px;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 18px;text-decoration:none;text-transform:uppercase;color:#e8c987;font-size:cl ass="home"><video class="live-bg" autoplay muted loop playsinline preload="auto" poster="tavern-bg.png" aria-hidden="true"><source src="tavern-live.mp4" type="video/mp4"></video><div class="shade"></div><div class="ui"><button class="round music" id="music" aria-label="Couper la musique">♫</button><button class="round logout" id="logout" aria-label="Se déconnecter" title="Déconnexion">↪</button><header class="hero"><img class="title-logo" src="Logo-titre.png" alt="Survival"></header><nav class="menu"><a class="btn" id="playBtn" href="characters.html"><span class="ico">▶</span>Jouer</a><a class="btn authBtn" href="login.html"><span class="ico">♟</span>Connexion</a><a class="btn authBtn" href="login.html?mode=register"><span class="ico">♟＋</span>Inscription</a></nav><footer class="studio"><img class="studio-logo" src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></div></main><audio id="theme" src="tavern-theme.mp3" loop preload="auto"></audio><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const v=document.querySelector('.live-bg');v.play().catch(()=>{});const a=document.getElementById('theme'),b=document.getElementById('music');a.volume=.32;let on=false;function state(x){on=x;b.textContent=x?'♫':'♪';b.classList.toggle('off',!x)}async function start(){try{await a.play();state(true)}catch(e){state(false)}}start();document.addEventListener('pointerdown',()=>{if(!on&&a.paused)start()},{once:true});b.onclick=async e=>{e.stopPropagation();if(on){a.pause();state(false)}else await start()};const out=document.getElementById('logout'),authBtns=document.querySelectorAll('.authBtn');async function syncAuth(){if(!window.sb)return;const {data:{session}}=await sb.auth.getSession();authBtns.forEach(x=>x.style.display=session?'none':'flex');out.style.display=session?'block':'none'}out.onclick=async()=>{await sb.auth.signOut();sessionStorage.removeItem('survival_character_id');await syncAuth()};syncAuth();sb?.auth.onAuthStateChange(()=>syncAuth());</script></body></html>
