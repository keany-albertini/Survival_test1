<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Connexion</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:#050301;color:#fff0c7}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:12px 14px 90px}.page:before{content:"";position:absolute;inset:0;background:#04101bbd}.shell{position:relative;z-index:1;width:min(94vw,430px);margin:auto}.back{color:#ffd06b;text-decoration:none;font-size:12px}.logo{display:block;width:min(91vw,410px);max-height:28vh;object-fit:contain;margin:auto}.panel{background:#0b2943f5;border:2px solid #d19a48;padding:20px 18px}h1{text-align:center;color:#f4c96d}.sub{text-align:center;color:#d8c39d;font-size:11px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab,.submit{font-family:inherit;font-weight:700}.tab{min-height:40px;color:#bcae92;border:1px solid #795328;background:#071b2e}.tab.active{color:#ffd46d;background:#1b496d}.form{display:none}.form.active{display:block}.field{margin:11px 0}.field label{display:block;font-size:9px;color:#efc572;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid #936638;background:#04131f;color:#fff;padding:0 12px}.submit{width:100%;min-height:49px;margin-top:9px;color:#fff1c9;border:2px solid #d19a48;background:#123c5d}.forgot{display:block;width:100%;margin:9px 0;border:0;background:none;color:#e9bd67;text-decoration:underline}.forgotBox{display:none}.forgotBox.open{display:block}.message{text-align:center;color:#ffd26c;font-size:12px;min-height:18px}.studio-mark{position:fixed;z-index:8;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:clamp(70px,19vw,112px);height:68px;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}.studio-mark img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 7px #000e);opacity:.92}</style></head><body><main class="page"><div class="shell"><a class="back" href="index.html">‹ ACCUEIL</a><img class="logo" src="Logo-titre.png" alt="Survival"><section class="panel"><h1>Entre dans le monde</h1><p class="sub">Rejoins la taverne et retrouve ton aventure.</p><div class="tabs"><button class="tab active" data-tab="login">CONNEXION</button><button class="tab" data-tab="register">INSCRIPTION</button></div><form id="loginForm" class="form active"><div class="field"><label>ADRESSE E-MAIL</label><input id="loginEmail" type="email" required></div><div class="field"><label>MOT DE PASSE</label><input id="loginPassword" type="password" required minlength="6"></div><button class="submit">SE CONNECTER</button><button type="button" id="forgotToggle" class="forgot">Mot de passe oublié ?</button></form><section id="forgotBox" class="forgotBox"><p>Entre ton adresse e-mail pour recevoir un lien.</p><div class="field"><input id="resetEmail" type="email"></div><button type="button" id="resetPassword" class="submit">ENVOYER LE LIEN</button></section><form id="registerForm" class="form"><div class="field"><label>PSEUDO</label><input id="registerName" required minlength="2"></div><div class="field"><label>ADRESSE E-MAIL</label><input id="registerEmail" type="email" required></div><div class="field"><label>MOT DE PASSE</label><input id="registerPassword" type="password" required minlength="6"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section></div><footer class="studio-mark"><img src="nini-pepita-logo.png?v=2" alt="Nini & Pepita Corporation"></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
