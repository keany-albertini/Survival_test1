<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>Survival — Connexion</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#050301;color:#fff0c7}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));overflow-x:hidden}.page:before{content:"";position:absolute;inset:0;background:linear-gradient(#02010155,#04101bc7 45%,#02070de8),radial-gradient(circle at 50% 22%,transparent 0 18%,#0008 90%)}.shell{position:relative;z-index:1;width:min(94vw,430px);margin:0 auto;min-height:calc(100dvh - 24px);display:flex;flex-direction:column}.back{align-self:flex-start;color:#ffd06b;text-decoration:none;font-size:12px;font-weight:700;margin:2px 0;padding:8px 10px;border:1px solid #9b672e;background:#071a2bd9}.logo{display:block;width:min(91vw,410px);max-height:28vh;object-fit:contain;margin:-2px auto 0;filter:drop-shadow(0 10px 13px #000d)}.panel{margin-top:-4px;background:linear-gradient(180deg,#153b5af5,#0b2943f7 45%,#061827fa);border:2px solid #d19a48;box-shadow:0 14px 32px #000e,inset 0 0 0 3px #030b12;padding:20px 18px 18px}h1{margin:0;text-align:center;font-size:24px;color:#f4c96d}.sub{text-align:center;color:#d8c39d;font-size:11px;margin:7px 10px 15px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}.tab,.submit{font-family:inherit;font-weight:700;cursor:pointer}.tab{min-height:40px;color:#bcae92;border:1px solid #795328;background:#071b2e}.tab.active{color:#ffd46d;border-color:#d29a46;background:#1b496d}.form{display:none}.form.active{display:block}.field{margin:11px 0}.field label{display:block;font-size:9px;font-weight:700;letter-spacing:1.6px;color:#efc572;margin:0 0 6px 3px}.field input{width:100%;height:45px;border:1px solid #936638;background:#04131fee;color:#fff5d8;padding:0 12px;outline:none}.submit{width:100%;min-height:49px;margin-top:9px;color:#fff1c9;font-size:13px;border:2px solid #d19a48;background:linear-gradient(#1b4b70,#071d31)}.forgot{display:block;width:100%;margin:9px 0 2px;border:0;background:none;color:#e9bd67;font:inherit;font-size:11px;text-decoration:underline;cursor:pointer}.forgotBox{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #7b5731}.forgotBox.open{display:block}.forgotBox p{text-align:center;font-size:11px;color:#d8c39d;margin:0 0 8px}.message{min-height:18px;margin-top:10px;text-align:center;font-size:12px;color:#ffd26c}.studio{text-align:center;margin-top:auto;padding:13px 0 2px;color:#cdb583;font-size:8px;letter-spacing:2px}.studio strong{display:block;font-size:13px;color:#d79a42}</style></head><body><main class="page"><div class="shell"><a class="back" href="index.html">‹ ACCUEIL</a><img class="logo" src="Logo-titre.png" alt="Survival"><section class="panel"><h1>Entre dans le monde</h1><p class="sub">Rejoins la taverne et retrouve ton aventure.</p><div class="tabs"><button class="tab active" data-tab="login">CONNEXION</button><button class="tab" data-tab="register">INSCRIPTION</button></div><form id="loginForm" class="form active"><div class="field"><label>ADRESSE E-MAIL</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="loginPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••"></div><button class="submit">SE CONNECTER</button><button type="button" id="forgotToggle" class="forgot">Mot de passe oublié ?</button></form><section id="forgotBox" class="forgotBox"><p>Entre ton adresse e-mail. Nous t'enverrons un lien pour choisir un nouveau mot de passe.</p><div class="field"><label>ADRESSE E-MAIL</label><input id="resetEmail" type="email" autocomplete="email" placeholder="survivant@email.fr"></div><button type="button" id="resetPassword" class="submit">ENVOYER LE LIEN</button></section><form id="registerForm" class="form"><div class="field"><label>PSEUDO</label><input id="registerName" required minlength="2" maxlength="20" placeholder="Ton nom de survivant"></div><div class="field"><label>ADRESSE E-MAIL</label><input id="registerEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="registerPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="6 caractères minimum"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section><footer class="studio">ÉDITÉ PAR LE STUDIO<strong>NINI &amp; PEPITA CORPORATION</strong></footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
