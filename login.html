<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte — Survival</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="page-shell"><a class="back" href="index.html">‹ Retour</a><section class="card"><p class="eyebrow">SURVIVAL</p><h1>Entre dans le monde</h1><p class="muted">Connecte-toi ou crée ton compte pour accéder à tes survivants.</p><div class="tabs"><button class="tab active" data-tab="login">Connexion</button><button class="tab" data-tab="register">Inscription</button></div><form id="loginForm" class="form active"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="submit">SE CONNECTER</button></form><form id="registerForm" class="form"><div class="field"><label>Pseudo</label><input id="registerName" required maxlength="20"></div><div class="field"><label>E-mail</label><input id="registerEmail" type="email" required autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="registerPassword" type="password" required minlength="6" autocomplete="new-password"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section></div></main><script src="auth.js"></script></body></html>
