<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival - Connexion</title><link rel="stylesheet" href="style.css"></head><body><main class="page auth-page"><div class="page-shell"><a class="back" href="index.html">← Retour à l'accueil</a><section class="card"><p class="eyebrow">ESPACE SURVIVANT</p><h1>Entre dans le monde.</h1><p class="muted">Connecte-toi ou crée ton compte pour retrouver tes personnages.</p><div class="tabs"><button class="tab active" data-tab="login">Connexion</button><button class="tab" data-tab="register">Inscription</button></div><form id="loginForm" class="form active"><div class="field"><label>ADRESSE E-MAIL</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="loginPassword" type="password" required minlength="6" autocomplete="current-password"></div><button class="submit">SE CONNECTER</button></form><form id="registerForm" class="form"><div class="field"><label>PSEUDO</label><input id="registerName" required minlength="2" maxlength="20" placeholder="Ton nom de survivant"></div><div class="field"><label>ADRESSE E-MAIL</label><input id="registerEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="registerPassword" type="password" required minlength="6" autocomplete="new-password"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
