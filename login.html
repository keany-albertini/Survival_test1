<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Survival — Connexion</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#080402;color:#fff0c7}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:18px 14px}.page:before{content:"";position:absolute;inset:0;background:linear-gradient(#02010155,#06111bd0),radial-gradient(circle at 50% 25%,transparent,#0008)}.shell{position:relative;z-index:1;width:min(92vw,430px);margin:auto}.back{display:inline-block;color:#f3c66d;text-decoration:none;font-size:13px;margin:4px 0 8px}.logo{display:block;width:min(82vw,390px);max-height:27vh;object-fit:contain;margin:0 auto 4px;filter:drop-shadow(0 8px 10px #000c)}.panel{background:linear-gradient(180deg,#102d47f2,#071a2df5);border:2px solid #bd833e;box-shadow:0 12px 30px #000d,inset 0 0 0 3px #06111c,inset 0 0 0 5px #7d5129;padding:20px 18px 18px;clip-path:polygon(3% 0,97% 0,100% 3%,100% 97%,97% 100%,3% 100%,0 97%,0 3%)}h1{margin:0;text-align:center;color:#ffe8a7;font-size:25px}.sub{text-align:center;color:#c9b996;font-size:12px;line-height:1.4;margin:7px 0 16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}.tab,.submit{font-family:inherit;font-weight:700;color:#fff0c7;border:1px solid #c58a3d;background:linear-gradient(#173a59,#071b30);box-shadow:inset 0 0 0 2px #06101a,inset 0 0 0 3px #8c5c2c}.tab{padding:10px 4px;opacity:.62}.tab.active{opacity:1;color:#ffd56e;box-shadow:0 0 12px #d7952540,inset 0 0 0 2px #06101a,inset 0 0 0 3px #c18a43}.form{display:none}.form.active{display:block}.field{margin:11px 0}.field label{display:block;font-size:9px;letter-spacing:1.5px;color:#e7bd71;margin-bottom:6px}.field input{width:100%;height:44px;border:1px solid #8c673c;background:#061522e8;color:#fff5d8;border-radius:3px;padding:0 12px;outline:none;box-shadow:inset 0 2px 7px #0008}.field input:focus{border-color:#e2ac55;box-shadow:0 0 9px #d5943345}.submit{width:100%;min-height:47px;margin-top:8px;font-size:13px;letter-spacing:.7px}.message{min-height:18px;margin-top:10px;text-align:center;font-size:12px}.studio{text-align:center;margin-top:13px;color:#d9b56f;font-size:9px;letter-spacing:2px}.studio strong{display:block;font-size:14px;letter-spacing:4px;color:#ffe6a4}@media(max-height:700px){.logo{max-height:20vh}.panel{padding-top:14px}.field{margin:8px 0}}</style></head><body><main class="page"><div class="shell"><a class="back" href="index.html">← Retour à l'accueil</a><img class="logo" src="Logo-titre.png" alt="Survival"><section class="panel"><h1>Entre dans le monde</h1><p class="sub">Connecte-toi ou crée ton compte pour retrouver tes survivants.</p><div class="tabs"><button class="tab active" data-tab="login">CONNEXION</button><button class="tab" data-tab="register">INSCRIPTION</button></div><form id="loginForm" class="form active"><div class="field"><label>ADRESSE E-MAIL</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="loginPassword" type="password" required minlength="6" autocomplete="current-password"></div><button class="submit">SE CONNECTER</button></form><form id="registerForm" class="form"><div class="field"><label>PSEUDO</label><input id="registerName" required minlength="2" maxlength="20" placeholder="Ton nom de survivant"></div><div class="field"><label>ADRESSE E-MAIL</label><input id="registerEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="registerPassword" type="password" required minlength="6" autocomplete="new-password"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section><footer class="studio">UN JEU PAR<strong>NINI CORPORATION</strong></footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
