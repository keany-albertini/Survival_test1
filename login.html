<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>Survival — Connexion</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#050301;color:#fff0c7}.page{position:relative;min-height:100dvh;background:url('tavern-bg.png') center/cover fixed no-repeat;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));overflow-x:hidden}.page:before{content:"";position:absolute;inset:0;background:linear-gradient(#02010155,#04101bc7 45%,#02070de8),radial-gradient(circle at 50% 22%,transparent 0 18%,#0008 90%)}.shell{position:relative;z-index:1;width:min(94vw,430px);margin:0 auto;min-height:calc(100dvh - 24px);display:flex;flex-direction:column}.back{align-self:flex-start;color:#ffd06b;text-decoration:none;font-size:12px;font-weight:700;margin:2px 0 2px;padding:8px 10px;border:1px solid #9b672e;background:#071a2bd9;box-shadow:0 3px 9px #000a;clip-path:polygon(7% 0,100% 0,100% 100%,7% 100%,0 50%)}.logo{display:block;width:min(91vw,410px);max-height:28vh;object-fit:contain;margin:-2px auto 0;filter:drop-shadow(0 10px 13px #000d)}.panel{position:relative;margin-top:-4px;background:linear-gradient(180deg,#153b5af5 0%,#0b2943f7 45%,#061827fa 100%);border:2px solid #d19a48;box-shadow:0 14px 32px #000e,inset 0 1px 0 #fff3b02b,inset 0 0 0 3px #030b12,inset 0 0 0 5px #805324;padding:20px 18px 18px;clip-path:polygon(4% 0,96% 0,100% 4%,100% 96%,96% 100%,4% 100%,0 96%,0 4%)}.panel:before,.panel:after{content:"◆";position:absolute;top:10px;color:#f1b951;font-size:8px;text-shadow:0 0 7px #e7a42b}.panel:before{left:13px}.panel:after{right:13px}h1{margin:0;text-align:center;font-size:24px;letter-spacing:.5px;background:linear-gradient(#fff5cc,#f4c96d 48%,#c9872f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 2px #000)}.sub{text-align:center;color:#d8c39d;font-size:11px;line-height:1.45;margin:7px 10px 15px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px;padding:3px;background:#030d16a6;border:1px solid #674521}.tab,.submit{font-family:inherit;font-weight:700;cursor:pointer}.tab{min-height:40px;color:#bcae92;border:1px solid #795328;background:linear-gradient(#0d2c47,#071b2e);opacity:.72}.tab.active{opacity:1;color:#ffd46d;border-color:#d29a46;background:linear-gradient(#1b496d,#0b2b47);box-shadow:0 0 12px #e2a53c36,inset 0 0 0 2px #06111b}.form{display:none}.form.active{display:block}.field{margin:11px 0}.field label{display:block;font-size:9px;font-weight:700;letter-spacing:1.6px;color:#efc572;margin:0 0 6px 3px}.field input{width:100%;height:45px;border:1px solid #936638;background:linear-gradient(180deg,#061a2aee,#04131fee);color:#fff5d8;border-radius:2px;padding:0 12px;outline:none;box-shadow:inset 0 2px 8px #0009,0 1px 0 #ffffff0c}.field input::placeholder{color:#8fa0a7}.field input:focus{border-color:#e6ae52;box-shadow:0 0 10px #e1a23a45,inset 0 2px 8px #0009}.submit{position:relative;width:100%;min-height:49px;margin-top:9px;color:#fff1c9;font-size:13px;letter-spacing:.8px;border:2px solid #d19a48;background:linear-gradient(180deg,#1b4b70,#0d3150 50%,#071d31);box-shadow:0 6px 13px #000b,inset 0 1px 0 #fff4bc38,inset 0 0 0 2px #06101a,inset 0 0 0 4px #845527;clip-path:polygon(5% 0,95% 0,100% 25%,100% 75%,95% 100%,5% 100%,0 75%,0 25%)}.submit:active{transform:translateY(2px);filter:brightness(1.2)}.message{min-height:18px;margin-top:10px;text-align:center;font-size:12px;color:#ffd26c}.studio{text-align:center;margin-top:auto;padding:13px 0 2px;color:#cdb583;font-size:8px;letter-spacing:2.4px;text-transform:uppercase}.studio strong{display:block;margin-top:2px;font-size:14px;letter-spacing:4px;background:linear-gradient(#fff0b7,#d79a42);-webkit-background-clip:text;background-clip:text;color:transparent}@media(max-height:720px){.logo{max-height:21vh}.panel{padding:15px 16px 14px}.sub{margin-bottom:10px}.field{margin:8px 0}.field input{height:41px}.submit{min-height:44px}.studio{padding-top:6px}}@media(min-width:700px){.shell{width:430px}}</style></head><body><main class="page"><div class="shell"><a class="back" href="index.html">‹ ACCUEIL</a><img class="logo" src="Logo-titre.png" alt="Survival"><section class="panel"><h1 id="formTitle">Entre dans le monde</h1><p class="sub">Rejoins la taverne et retrouve ton aventure.</p><div class="tabs"><button class="tab active" data-tab="login">CONNEXION</button><button class="tab" data-tab="register">INSCRIPTION</button></div><form id="loginForm" class="form active"><div class="field"><label>ADRESSE E-MAIL</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="loginPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••"></div><button class="submit">SE CONNECTER</button></form><form id="registerForm" class="form"><div class="field"><label>PSEUDO</label><input id="registerName" required minlength="2" maxlength="20" placeholder="Ton nom de survivant"></div><div class="field"><label>ADRESSE E-MAIL</label><input id="registerEmail" type="email" required autocomplete="email" placeholder="survivant@email.fr"></div><div class="field"><label>MOT DE PASSE</label><input id="registerPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="6 caractères minimum"></div><button class="submit">CRÉER MON COMPTE</button></form><div id="message" class="message"></div></section><footer class="studio">ÉDITÉ PAR LE STUDIO<strong>NINI CORPORATION</strong></footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
